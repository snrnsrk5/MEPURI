<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>메푸리 시세 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#F1F4F6;--top:#1F232E;--logo:#D2F53C;--card:#FFFFFF;--card-bd:rgba(0,0,0,.08);--border:#E4E8EB;--border2:#C8CFD5;--seg:#E4E8EB;--soft:#F4F5F6;
  --text:#1E3043;--text2:#3B546B;--sub:#6C7784;--muted:#98A0A9;--faint:#B1B9C3;--price:#2F3033;--input-bd:#C6CFD7;--input-fg:#223548;
  --accent:#F68600;--accent-hover:#DA7700;--accent-soft:#FFECD5;--accent-bg:#FFFBF6;--danger:#E0475B;--danger-bg:#FFF4F5;--danger-bd:#F2BBC3;--ok:#1896B0;--ok-bg:#E9F7FB;
  --frame-bg:linear-gradient(180deg,#F8F9FA,#E6E9EC);--toast:#2B2F3A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14161B;--top:#0C0D11;--card:#1E2128;--card-bd:rgba(255,255,255,.07);--border:#30343D;--border2:#4A4F5B;--seg:#2A2E37;--soft:#252932;
  --text:#ECEEF2;--text2:#C9D2DC;--sub:#A3ABB6;--muted:#7D8591;--faint:#5B606B;--price:#ECEEF2;--input-bd:#3A3F4A;--input-fg:#E3E7EC;
  --accent:#FF8A33;--accent-hover:#FF9C52;--accent-soft:#3A2616;--accent-bg:#2A1F16;--danger:#E0475B;--danger-bg:#2B171B;--danger-bd:#5C2A33;--ok:#5FD0E6;--ok-bg:#16323A;
  --frame-bg:linear-gradient(180deg,#2C313B,#22262E);--toast:#2B2F3A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:13px;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{background:var(--top)}.top .wrap{display:flex;align-items:center;gap:10px;height:40px}
.logo{font-size:16px;font-weight:800;letter-spacing:.02em;color:var(--logo)}.top small{color:#98A0A9;font-size:12px;font-weight:500}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
main.wrap{display:flex;flex-direction:column;gap:10px;padding-block:16px 48px}
.card{padding:14px 16px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{min-width:64px;font-size:12px;font-weight:500;color:var(--muted)}
.inp{height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--input-bd);background:var(--card);color:var(--input-fg);min-width:0}
.inp:focus{border-color:var(--accent);outline:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:32px;padding:0 14px;border-radius:6px;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{background:var(--accent-hover)}.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.out{border:1px solid var(--input-bd);background:var(--card);color:var(--sub)}.btn.out:hover{background:var(--soft)}
.btn.danger{border:1px solid var(--danger-bd);background:var(--danger-bg);color:var(--danger)}.btn.danger.arm{background:var(--danger);color:#fff;border-color:var(--danger)}
.hint{font-size:12px;color:var(--muted)}
.demo{padding:8px 12px;border-radius:8px;border:1px dashed var(--accent);background:var(--accent-bg);color:var(--accent);font-size:12px}
.dates{display:flex;gap:6px;flex-wrap:wrap}
.dchip{height:26px;padding:0 10px;border-radius:999px;background:var(--seg);color:var(--sub);font-size:12px;font-weight:500}
.dchip.on{background:var(--accent);color:#fff}.dchip.new{background:none;border:1px dashed var(--border2);color:var(--muted)}
.head,.it{display:grid;grid-template-columns:36px minmax(0,1fr) 110px 120px;align-items:center;gap:10px}
.head{min-height:34px;padding:0 12px;border-radius:9px;background:var(--seg);font-size:12px;font-weight:500;color:var(--muted)}
.head span:nth-child(n+3){text-align:right}
.it{min-height:48px;padding:6px 12px;border-bottom:1px solid var(--border)}
.it:last-child{border-bottom:0}
.ic{display:grid;place-items:center;width:36px;height:36px;border-radius:6px;border:1px solid var(--border);background:var(--frame-bg)}.ic img{width:30px;height:30px;image-rendering:pixelated}
.nm{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev{text-align:right;font-size:12px;color:var(--muted)}.prev b{font-weight:700;color:var(--text2)}
.it .inp{width:100%;text-align:right}
.it.chg .inp{border-color:var(--accent);background:var(--accent-bg)}
.it.empty .inp::placeholder{color:var(--faint)}
.unit{font-size:11px;color:var(--muted)}
.foot{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card);box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.foot .sp{flex:1}
textarea.inp{width:100%;height:120px;padding:8px 10px;resize:vertical;line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 16px;border-radius:8px;background:var(--toast);color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9}
.hide{display:none!important}
@media (max-width:560px){.head,.it{grid-template-columns:32px minmax(0,1fr) 96px}.head span:nth-child(3),.it .prev{display:none}}
</style>
</head>

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kstToday=()=>{const d=new Date(Date.now()+9*3600e3);return d.getUTCFullYear()+'.'+String(d.getUTCMonth()+1).padStart(2,'0')+'.'+String(d.getUTCDate()).padStart(2,'0')};
const fmt=v=>v==null||v===''?'':String(+v);
const S={pw:'',ok:false,hist:[],d:kstToday(),vals:{},extra:[],arm:false,busy:false,paste:false};
try{S.pw=sessionStorage.getItem('mepuri-admin')||''}catch(e){}

// ── 서버 ──
let demoDB=null;
async function api(path,body){
  if(DEMO){ // 테스트: 메모리에서 흉내
    if(!demoDB)demoDB=new Map();
    if(path==='/api/loot-prices')return {hist:[...demoDB].sort((a,b)=>a[0]<b[0]?-1:1).map(([d,p])=>({d,p}))};
    if(body.password!=='test')throw new Error('비밀번호가 달라요 (테스트 비밀번호: test)');
    if(path==='/api/admin/login')return {ok:true};
    if(path==='/api/admin/prices'){const p={};Object.entries(body.p).forEach(([k,v])=>{if(v!==''&&v!=null)p[k]=+v});demoDB.set(body.d,p);return {ok:true,count:Object.keys(p).length}}
    if(path==='/api/admin/delete'){demoDB.delete(body.d);return {ok:true}}
  }
  const r=await fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store'}:{cache:'no-store'});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&j.error&&j.error.message)||('서버 오류 '+r.status));
  return j;
}

// ── 시세 계산 ──
const allHist=()=>{const m=new Map(BUILTIN.map(s=>[s.d,{d:s.d,p:s.p,b:1}]));S.hist.forEach(s=>m.set(s.d,{d:s.d,p:s.p,srv:1}));return [...m.values()].sort((a,b)=>a.d<b.d?-1:1)};
const items=()=>{const seen=new Set(),out=[];allHist().slice().reverse().forEach(s=>Object.keys(s.p).forEach(n=>{if(!seen.has(n)){seen.add(n);out.push(n)}}));S.extra.forEach(n=>{if(!seen.has(n)){seen.add(n);out.push(n)}});
  const at=n=>{const h=allHist();for(let i=h.length-1;i>=0;i--)if(h[i].p[n]!=null)return h[i].p[n];return 0};return out.sort((a,b)=>at(b)-at(a))};
const prevOf=n=>{const h=allHist();for(let i=h.length-1;i>=0;i--){if(h[i].d>=S.d)continue;if(h[i].p[n]!=null)return {v:h[i].p[n],d:h[i].d}}return null};
const srvAt=d=>S.hist.find(s=>s.d===d);
function loadDate(d){S.d=d;S.arm=false;const s=srvAt(d)||BUILTIN.find(x=>x.d===d); // 서버에 없고 페이지 기본 시세에 있는 날짜면 그 값으로 채워 둠
  S.vals={};if(s)Object.entries(s.p).forEach(([k,v])=>S.vals[k]=fmt(v));render()}
// '880', '880억', '1,500억', '12.5' → 억 단위 숫자
const parseV=t=>{const s=String(t).replace(/[,\s]/g,'').replace(/억$/,'');if(s==='')return '';const n=Number(s);return Number.isFinite(n)&&n>=0?n:NaN};

// ── 화면 ──
let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}
function render(){
  const app=$('#app');
  const demo=DEMO?'<div class="demo">테스트 화면이에요. 서버 없이 이 창 안에서만 저장돼요. 비밀번호는 <b>test</b>.</div>':'';
  if(!S.ok){app.innerHTML=demo+`<div class="card"><form class="row" id="lf"><span class="lbl">비밀번호</span><input class="inp" id="pw" type="password" autocomplete="current-password" style="flex:1;min-width:160px" value="${esc(S.pw)}"><button class="btn pri" ${S.busy?'disabled':''}>확인</button></form><p class="hint" style="margin:8px 0 0">비밀번호를 넣으면 날짜별 물욕 시세를 고칠 수 있어요. 시세는 억 메소 단위예요.</p></div>`;
    $('#lf').onsubmit=async e=>{e.preventDefault();S.pw=$('#pw').value;S.busy=true;render();try{await api('/api/admin/login',{password:S.pw});S.ok=true;try{sessionStorage.setItem('mepuri-admin',S.pw)}catch(e){}await refresh();loadDate(S.d)}catch(err){toast(err.message);S.busy=false;render()}S.busy=false};
    return}
  const ds=[...new Set([...S.hist.map(s=>s.d)])].sort().reverse(),list=items(),has=!!srvAt(S.d);
  let chg=0;const rows=list.map(n=>{const pv=prevOf(n),v=S.vals[n]??'',saved=srvAt(S.d)&&srvAt(S.d).p[n]!=null?fmt(srvAt(S.d).p[n]):'',c=v!==saved;if(c)chg++;
    return `<div class="it${c?' chg':''}${v===''?' empty':''}"><span class="ic">${ICONS[n]?`<img src="${ICONS[n]}" alt="">`:''}</span><span class="nm" title="${esc(n)}">${esc(n)}</span><span class="prev num">${pv?`<b>${fmt(pv.v)}</b>억 <span class="unit">${pv.d.slice(5)}</span>`:'—'}</span><input class="inp num" inputmode="decimal" data-n="${esc(n)}" value="${esc(v)}" placeholder="${pv?fmt(pv.v):'억'}" aria-label="${esc(n)} 시세 (억)"></div>`}).join('');
  app.innerHTML=demo+`<div class="card"><div class="row"><span class="lbl">날짜</span><input class="inp num" id="d" value="${esc(S.d)}" style="width:120px" aria-label="날짜 (2026.10.03)"><button class="btn out" id="today">오늘</button><span class="hint">${has?'서버에 저장된 날짜예요':'아직 저장 안 된 날짜예요'}</span></div>
    <div class="row" style="margin-top:10px"><span class="lbl">저장된 날</span><div class="dates">${ds.length?ds.map(d=>`<button class="dchip${d===S.d?' on':''}" data-d="${d}">${d.slice(2)}</button>`).join(''):'<span class="hint">아직 없어요. 사이트는 페이지에 들어 있는 기본 시세를 써요.</span>'}</div></div></div>
    <div class="card" style="padding:8px"><div class="head"><span></span><span>아이템</span><span>직전 시세</span><span>이 날짜 시세 (억)</span></div>${rows}
      <div class="row" style="padding:10px 12px 4px"><input class="inp" id="newn" placeholder="목록에 없는 템 이름" style="flex:1;min-width:160px"><button class="btn out" id="addn">템 추가</button></div></div>
    <div class="card ${S.paste?'':'hide'}" id="pc"><textarea class="inp" id="pt" placeholder="한 줄에 하나씩: 템 이름 + 시세 (억)&#10;예) 굶주리는 핏빛 원혼 880&#10;     익셉셔널 해머 (귀고리): 1,500억&#10;JSON {&quot;템&quot;:880} 도 돼요"></textarea><div class="row" style="margin-top:8px"><span class="hint" style="flex:1">붙여넣고 넣기를 누르면 아래 칸이 채워져요. 저장은 따로 눌러야 해요.</span><button class="btn out" id="pgo">넣기</button></div></div>
    <div class="foot"><button class="btn out" id="fill">빈 칸에 직전 값</button><button class="btn out" id="pst">붙여넣기</button><span class="sp"></span>${has?`<button class="btn danger${S.arm?' arm':''}" id="del">${S.arm?'한 번 더 누르면 지워요':'이 날짜 지우기'}</button>`:''}<button class="btn pri" id="save" ${S.busy?'disabled':''}>저장${chg?` (${chg})`:''}</button></div>`;
  $('#d').onchange=e=>{const v=e.target.value.trim().replace(/[-/]/g,'.');if(!/^\d{4}\.\d\d\.\d\d$/.test(v)){toast('날짜는 2026.10.03 모양으로 적어 주세요');e.target.value=S.d;return}loadDate(v)};
  $('#today').onclick=()=>loadDate(kstToday());
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>loadDate(b.dataset.d));
  app.querySelectorAll('.it .inp').forEach(i=>{i.oninput=()=>{S.vals[i.dataset.n]=i.value.trim()};i.onchange=()=>render()});
  $('#addn').onclick=()=>{const n=$('#newn').value.trim();if(!n)return;if(!S.extra.includes(n))S.extra.push(n);render()};
  $('#fill').onclick=()=>{let k=0;items().forEach(n=>{if((S.vals[n]??'')===''){const pv=prevOf(n);if(pv){S.vals[n]=fmt(pv.v);k++}}});render();toast(k?`빈 칸 ${k}개를 직전 값으로 채웠어요`:'채울 빈 칸이 없어요')};
  $('#pst').onclick=()=>{S.paste=!S.paste;render();if(S.paste)$('#pt').focus()};
  $('#pgo').onclick=()=>{const t=$('#pt').value;let k=0,bad=[];
    try{const j=JSON.parse(t);if(j&&typeof j==='object'){Object.entries(j).forEach(([n,v])=>{const x=parseV(v);if(Number.isNaN(x))bad.push(n);else{S.vals[n]=fmt(x);if(!items().includes(n))S.extra.push(n);k++}})}}
    catch(e){t.split(/\n/).forEach(l=>{const m=l.trim().match(/^(.+?)\s*[:=\t,]?\s*([\d.,]+)\s*억?$/);if(!m)return;const n=m[1].trim().replace(/[:=,]$/,'').trim(),x=parseV(m[2]);if(!n||Number.isNaN(x)){bad.push(n||l);return}S.vals[n]=fmt(x);if(!items().includes(n))S.extra.push(n);k++})}
    render();toast(`${k}개 넣었어요${bad.length?` · 못 읽은 줄 ${bad.length}개`:''}`)};
  if($('#del'))$('#del').onclick=async()=>{if(!S.arm){S.arm=true;render();setTimeout(()=>{if(S.arm){S.arm=false;render()}},3000);return}
    try{await api('/api/admin/delete',{password:S.pw,d:S.d});toast(`${S.d} 시세를 지웠어요`);await refresh();loadDate(S.d)}catch(e){toast(e.message)}};
  $('#save').onclick=async()=>{const p={},bad=[];Object.entries(S.vals).forEach(([n,v])=>{if(v==='')return;const x=parseV(v);if(Number.isNaN(x))bad.push(n);else p[n]=x});
    if(bad.length){toast(`숫자가 아닌 칸이 있어요: ${bad[0]}`);return}
    if(!Object.keys(p).length){toast('저장할 시세가 없어요. 지우려면 "이 날짜 지우기"를 눌러 주세요');return}
    S.busy=true;render();try{const r=await api('/api/admin/prices',{password:S.pw,d:S.d,p});toast(`${S.d} 시세 ${r.count}개를 저장했어요`);await refresh();loadDate(S.d)}catch(e){toast(e.message)}S.busy=false;render()};
}
async function refresh(){try{const j=await api('/api/loot-prices');S.hist=(j&&j.hist)||[]}catch(e){toast('시세를 불러오지 못했어요: '+e.message)}}
render();
</script>
</body>
</html>
