<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>메푸리 시세 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#F1F4F6;--top:#1F232E;--logo:#D2F53C;--card:#FFFFFF;--card-bd:rgba(0,0,0,.08);--border:#E4E8EB;--border2:#C8CFD5;--seg:#E4E8EB;--soft:#F4F5F6;
  --text:#1E3043;--text2:#3B546B;--sub:#6C7784;--muted:#98A0A9;--faint:#B1B9C3;--input-bd:#C6CFD7;--input-fg:#223548;--dot-off:#8B94A3;--dot-on:#202226;
  --accent:#F68600;--accent-hover:#DA7700;--accent-soft:#FFECD5;--accent-bg:#FFFBF6;--danger:#E0475B;--danger-bg:#FFF4F5;--danger-bd:#F2BBC3;
  --warn:#C77700;--warn-bg:#FFF6E5;--warn-bd:#F5D9A6;--frame-bg:linear-gradient(180deg,#F8F9FA,#E6E9EC);--toast:#2B2F3A;--seg-shadow:0 1.5px 0 rgba(152,162,179,.25);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14161B;--top:#0C0D11;--card:#1E2128;--card-bd:rgba(255,255,255,.07);--border:#30343D;--border2:#4A4F5B;--seg:#2A2E37;--soft:#252932;
  --text:#ECEEF2;--text2:#C9D2DC;--sub:#A3ABB6;--muted:#7D8591;--faint:#5B606B;--input-bd:#3A3F4A;--input-fg:#E3E7EC;--dot-off:#7D8591;--dot-on:#ECEEF2;
  --accent:#FF8A33;--accent-hover:#FF9C52;--accent-soft:#3A2616;--accent-bg:#2A1F16;--danger:#E0475B;--danger-bg:#2B171B;--danger-bd:#5C2A33;
  --warn:#F2B14C;--warn-bg:#2E2414;--warn-bd:#5A4320;--frame-bg:linear-gradient(180deg,#2C313B,#22262E);--toast:#2B2F3A;--seg-shadow:0 1.5px 0 rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:13px;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{background:var(--top)}.top .wrap{display:flex;align-items:center;gap:10px;height:40px}
.logo{font-size:16px;font-weight:800;letter-spacing:.02em;color:var(--logo)}.top small{color:#98A0A9;font-size:12px;font-weight:500}
.wrap{max-width:800px;margin:0 auto;padding-inline:16px}
main.wrap{display:flex;flex-direction:column;gap:10px;padding-block:16px 48px}
.card{padding:14px 16px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{min-width:64px;font-size:12px;font-weight:500;color:var(--muted)}
.inp{height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--input-bd);background:var(--card);color:var(--input-fg);min-width:0}
.inp:focus{border-color:var(--accent);outline:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:32px;padding:0 14px;border-radius:6px;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{background:var(--accent-hover)}.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.out{border:1px solid var(--input-bd);background:var(--card);color:var(--sub)}.btn.out:hover{background:var(--soft)}
.btn.danger{border:1px solid var(--danger-bd);background:var(--danger-bg);color:var(--danger)}.btn.danger.arm{background:var(--danger);color:#fff;border-color:var(--danger)}
.hint{font-size:12px;color:var(--muted)}
.demo{padding:8px 12px;border-radius:8px;border:1px dashed var(--accent);background:var(--accent-bg);color:var(--accent);font-size:12px}
.mode{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:8px;background:var(--soft);color:var(--sub);font-size:12px;line-height:18px}.mode b{color:var(--text2)}
/* 필터 (옥션 점 필터처럼) + 정렬 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:36px}
.dots{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dot{display:flex;align-items:center;font-size:14px;font-weight:500;color:var(--dot-off)}.dot .num{margin-left:4px}
.dot::before{content:"";width:6px;height:6px;margin-right:8px;border-radius:3px;background:var(--faint)}
.dot.on{color:var(--dot-on)}.dot.on::before{background:var(--accent)}
.dot.w::before{background:var(--warn)}.dot.w.zero{opacity:.45}
.seg{display:inline-flex;gap:2px;height:30px;padding:2px;border-radius:6px;background:var(--seg)}
.seg button{padding:0 12px;border-radius:4px;font-size:12px;font-weight:600;color:var(--sub)}.seg button.on{background:var(--card);box-shadow:var(--seg-shadow);color:var(--text)}
.srch{flex:none;min-width:160px}
/* 표 */
.head,.it{display:grid;grid-template-columns:40px minmax(0,1fr) 120px;align-items:center;gap:10px}
.head{min-height:34px;padding:0 12px;border-radius:9px;background:var(--seg);font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
.head span:nth-child(n+3){text-align:right}
.it{min-height:52px;padding:6px 12px;border-bottom:1px solid var(--border)}
.it:last-child{border-bottom:0}
.ic{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:6px;border:1px solid var(--border);background:var(--frame-bg)}.ic img{max-width:34px;max-height:34px;object-fit:contain} /* 아이콘은 정사각형이 아니라서 늘리지 않고 원래 비율 그대로 */
.ic.no{border:1px dashed var(--warn-bd);background:var(--warn-bg);color:var(--warn);font-size:15px;font-weight:800}
.nmw{display:flex;flex-direction:column;gap:2px;min-width:0}
.nm{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:3px;height:17px;padding:0 6px;border-radius:4px;border:1px solid var(--warn-bd);background:var(--warn-bg);color:var(--warn);font-size:10px;font-weight:700;white-space:nowrap}
.tag::before{content:"!";font-weight:900}
.it .inp{width:100%;text-align:right}
.it.chg .inp{border-color:var(--accent);background:var(--accent-bg)}
.it.nop .inp{border-color:var(--warn-bd)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.foot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card);box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.foot .sp{flex:1}
textarea.inp{width:100%;height:120px;padding:8px 10px;resize:vertical;line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 16px;border-radius:8px;background:var(--toast);color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9}
.hide{display:none!important}
@media (max-width:560px){.head,.it{grid-template-columns:36px minmax(0,1fr) 100px}.ic{width:36px;height:36px}.ic img{max-width:30px;max-height:30px}.dots{gap:14px}}
/* ── 물욕 등급 아이콘 (사이트 stats.css에서 그대로 가져옴) ── */
.sx-ifr{position:relative;display:grid;place-items:center;flex-shrink:0;width:40px;height:40px;border-radius:6px;border:1px solid var(--border);background:var(--frame-bg);color:var(--muted)}
.sx-ifr img{max-width:32px;max-height:32px;object-fit:contain;image-rendering:auto}.sx-ifr svg{width:18px;height:18px}
/* 비싼 물욕 (등급 금액): 브론즈~다이아는 아이콘 아래 등급색 줄 + 금액 글자색 (조용하게),
   레드·블랙은 목록 줄 전체를 칠함 — 레드: 진빨강, 블랙: 검정 + 금테 · 금빛 글자 (블랙 라벨) */
.sx-auc,.sxp{--t-bronze:#B87A5E;--t-silver:#8D98A6;--t-gold:#D99A12;--t-dia:#3E9BEA;--t-red:#E2334B;--t-black:#E2B13C}
:root[data-theme="dark"] :is(.sx-auc,.sxp),:root[data-mode="deep"] :is(.sx-auc,.sxp){--t-bronze:#D29A7E;--t-silver:#C3CCD6;--t-gold:#F4C04A;--t-dia:#6CB8FF;--t-red:#FF5A6E;--t-black:#F0C24E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(.sx-auc,.sxp){--t-bronze:#D29A7E;--t-silver:#C3CCD6;--t-gold:#F4C04A;--t-dia:#6CB8FF;--t-red:#FF5A6E;--t-black:#F0C24E}}
/* 아이콘 칸: 등급별 색 · 움직임 (v240 그대로) */
.sx-ifr>img,.sx-ifr>svg{position:relative;z-index:1}
/* 비싼 물욕: 등급 색 (미선택 주황 테두리와 같은 1px) — 브론즈는 반짝임 없음, 위로 갈수록 더 반짝임 */
.sx-ifr.bronze{border-color:#B9773F;background:linear-gradient(160deg,#FBF1E7,#EBCFB4)}
.sx-ifr.silver{border-color:#8E99A7;box-shadow:0 0 6px rgba(120,136,155,.45);background:linear-gradient(160deg,#FAFBFC,#D3DAE2)}
.sx-ifr.gold{border-color:#E0AE3A;box-shadow:0 0 6px rgba(224,174,58,.4);background:linear-gradient(160deg,#FFF6DD,#F3DFA6)}
.sx-ifr.dia{border-color:#3FB7D6;box-shadow:0 0 7px rgba(63,183,214,.5);background:linear-gradient(160deg,#F0FCFF,#BFE9F5)}
.sx-ifr.red{border-color:#E0414E;box-shadow:0 0 8px rgba(224,65,78,.5);background:linear-gradient(160deg,#FFF0F1,#F7C3C8)}
.sx-ifr.black{border-color:#E0AE3A;box-shadow:0 0 9px rgba(224,174,58,.45);background:linear-gradient(160deg,#4A4A55,#17171C)}
:root[data-theme="dark"] .sx-ifr.bronze,:root[data-mode="deep"] .sx-ifr.bronze{background:linear-gradient(160deg,#4A3524,#2E2219)}
:root[data-theme="dark"] .sx-ifr.silver,:root[data-mode="deep"] .sx-ifr.silver{border-color:#C3CCD6;box-shadow:0 0 6px rgba(195,204,214,.3);background:linear-gradient(160deg,#3A4048,#2A2F36)}
:root[data-theme="dark"] .sx-ifr.gold,:root[data-mode="deep"] .sx-ifr.gold{background:linear-gradient(160deg,#4A3D1F,#33291A);box-shadow:0 0 6px rgba(224,174,58,.3)}
:root[data-theme="dark"] .sx-ifr.dia,:root[data-mode="deep"] .sx-ifr.dia{background:linear-gradient(160deg,#1E4450,#152F38)}
:root[data-theme="dark"] .sx-ifr.red,:root[data-mode="deep"] .sx-ifr.red{background:linear-gradient(160deg,#4E2227,#33171B)}
:root[data-theme="dark"] .sx-ifr.black,:root[data-mode="deep"] .sx-ifr.black{border-color:#E0AE3A;background:linear-gradient(160deg,#2A2A31,#0B0B0E)}
/* ── 등급별 움직임 (전부 transform·opacity만 움직여서 부드럽게) ──
   브론즈: 안 움직임 · 실버: 가는 빛 한 줄 · 골드: 빛 줄기 + 아이콘 위로 금빛 + 은은한 숨쉬기
   다이아: 무지개빛 줄기 + 모서리 별 반짝 · 레드: 테두리를 도는 빛 + 두근 · 블랙: 금빛 두 줄이 돌고 + 별 + 숨쉬기 */
.sx-ifr .gl,.sx-ifr .gl2,.sx-ifr .gw,.sx-ifr .sp{position:absolute;pointer-events:none;display:none}
/* 테두리 모양 칸 */
.sx-ifr .gl{inset:-1px;border-radius:6px;padding:1px;overflow:hidden;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.sx-ifr .gl i,.sx-ifr .gl2 i{position:absolute;top:-60%;left:0;width:55%;height:220%;transform:translate3d(-190%,0,0) rotate(25deg);animation:sxGlint 3s linear infinite;will-change:transform}
.sx-ifr .gl i{background:linear-gradient(90deg,transparent,var(--glint) 32%,var(--glint2) 50%,var(--glint) 68%,transparent)}
/* 아이콘 위로 지나가는 빛 */
.sx-ifr .gl2{inset:0;border-radius:5px;overflow:hidden}
.sx-ifr .gl2 i{mix-blend-mode:screen;background:linear-gradient(90deg,transparent 30%,var(--sheen) 50%,transparent 70%)}
/* 숨쉬는 빛 (바깥 번짐을 opacity로만) */
.sx-ifr .gw{inset:-1px;border-radius:7px;box-shadow:0 0 10px 1px var(--glow);opacity:.25;animation:sxBreath 2.8s ease-in-out infinite;will-change:opacity}
/* 모서리 별 */
.sx-ifr .sp{inset:0}
.sx-ifr .sp::before,.sx-ifr .sp::after{content:'';position:absolute;width:9px;height:9px;background:var(--star);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  transform:scale(0);animation:sxTwinkle 2.4s ease-in-out infinite;will-change:transform,opacity;filter:drop-shadow(0 0 2px var(--star))}
.sx-ifr .sp::before{top:-4px;right:-4px}.sx-ifr .sp::after{bottom:-4px;left:-4px;width:7px;height:7px;animation-delay:1.2s}
/* 등급별 */
.sx-ifr.silver{--glint:#7FA6D6;--glint2:#F2F8FF}
.sx-ifr.silver .gl{display:block}.sx-ifr.silver .gl i{width:60%;opacity:.8;animation-duration:6s}
.sx-ifr.gold{--glint:#FFB300;--glint2:#FFFFFF;--sheen:rgba(255,240,180,.7);--glow:rgba(255,190,40,.75)}
.sx-ifr.gold .gl,.sx-ifr.gold .gl2,.sx-ifr.gold .gw{display:block}.sx-ifr.gold .gl i,.sx-ifr.gold .gl2 i{width:80%;animation-duration:5.4s}
.sx-ifr.dia{--glint2:#FFFFFF;--sheen:rgba(220,250,255,.8);--glow:rgba(80,190,240,.75)}
.sx-ifr.dia .gl,.sx-ifr.dia .gl2,.sx-ifr.dia .gw{display:block}.sx-ifr.dia .gw{animation-duration:3s}
.sx-ifr.dia .gl i{width:90%;animation-duration:5s;background:linear-gradient(90deg,transparent,#7EE0FF 20%,#B49CFF 35%,#FFFFFF 50%,#FF9CD6 65%,#8CF5C8 80%,transparent)}
.sx-ifr.dia .gl2 i{width:85%;animation-duration:5s;background:linear-gradient(90deg,transparent 25%,rgba(150,230,255,.45) 40%,rgba(255,255,255,.85) 50%,rgba(255,170,230,.45) 60%,transparent 75%)}
/* 레드부터 모서리 별 (다이아보다 한 단계 위) */
.sx-ifr.red .sp::before,.sx-ifr.red .sp::after{filter:drop-shadow(0 0 2px #FF3B4E) drop-shadow(0 0 1px #FF3B4E)}
.sx-ifr.red{--glow:rgba(255,50,70,.8);--glint:#FF3B4E;--glint2:#FFE3E6;--sheen:rgba(255,205,212,.7)}
.sx-ifr.red{--star:#FFE3E6}.sx-ifr.red .gl,.sx-ifr.red .gl2,.sx-ifr.red .gw,.sx-ifr.red .sp{display:block}.sx-ifr.red .gl i,.sx-ifr.red .gl2 i{width:90%;animation-duration:4.6s}.sx-ifr.red .gw{box-shadow:0 0 14px 2px var(--glow);animation-duration:3.2s}
.sx-ifr.black .gl i{top:-50%;left:-50%;width:200%;height:200%;transform:none;animation:sxSpin 4s linear infinite}
.sx-ifr.black{--glow:rgba(255,190,40,.8);--sheen:rgba(255,236,170,.75);--star:#FFD970}
.sx-ifr.black .gl,.sx-ifr.black .gl2,.sx-ifr.black .gw,.sx-ifr.black .sp{display:block}
.sx-ifr.black .gl i{animation-duration:4s;background:conic-gradient(from 0deg,transparent 0 20%,#FFB300 32%,#FFF6CC 37%,#FFB300 42%,transparent 50% 70%,#FFB300 82%,#FFF6CC 87%,#FFB300 92%,transparent)}
.sx-ifr.black .gl2 i{width:90%;animation-duration:4.4s}.sx-ifr.black .gw{animation-duration:2.2s}
@keyframes sxGlint{0%{transform:translate3d(-190%,0,0) rotate(25deg)}70%,100%{transform:translate3d(210%,0,0) rotate(25deg)}}
@keyframes sxSpin{to{transform:rotate(360deg)}}
@keyframes sxBreath{0%,100%{opacity:.2}50%{opacity:.9}}
@keyframes sxBeat{0%,40%,100%{opacity:.15}15%{opacity:1}28%{opacity:.5}34%{opacity:.85}}
@keyframes sxTwinkle{0%,55%,100%{transform:scale(0) rotate(0);opacity:0}70%{transform:scale(1.1) rotate(45deg);opacity:1}85%{transform:scale(.6) rotate(90deg);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sx-ifr .gl,.sx-ifr .gl2,.sx-ifr .gw,.sx-ifr .sp{display:none!important}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sx-ifr.bronze{background:linear-gradient(160deg,#4A3524,#2E2219)}:root:not([data-theme="light"]) .sx-ifr.silver{border-color:#C3CCD6;box-shadow:0 0 6px rgba(195,204,214,.3);background:linear-gradient(160deg,#3A4048,#2A2F36)}:root:not([data-theme="light"]) .sx-ifr.gold{background:linear-gradient(160deg,#4A3D1F,#33291A);box-shadow:0 0 6px rgba(224,174,58,.3)}:root:not([data-theme="light"]) .sx-ifr.dia{background:linear-gradient(160deg,#1E4450,#152F38)}:root:not([data-theme="light"]) .sx-ifr.red{background:linear-gradient(160deg,#4E2227,#33171B)}:root:not([data-theme="light"]) .sx-ifr.black{border-color:#E0AE3A;background:linear-gradient(160deg,#2A2A31,#0B0B0E)}}
.sx-ifr.bronze,.sx-tv.bronze{--tc:var(--t-bronze)}.sx-ifr.silver,.sx-tv.silver{--tc:var(--t-silver)}.sx-ifr.gold,.sx-tv.gold{--tc:var(--t-gold)}
.sx-ifr.dia,.sx-tv.dia{--tc:var(--t-dia)}.sx-ifr.red,.sx-tv.red{--tc:var(--t-red)}.sx-ifr.black,.sx-tv.black{--tc:var(--t-black)}
.ic.sx-ifr{width:40px;height:40px}
.tt{font-size:10px;font-weight:800;color:var(--tc)}
</style>
</head>
<body>
<div class="top"><div class="wrap"><span class="logo">MEPURI</span><small>물욕 시세 관리</small></div></div>
<main class="wrap sx-auc" id="app"></main>
<script>
// 메푸리 물욕 시세 관리: 비밀번호를 넣으면 시세를 고칠 수 있음 (서버 /api/admin/*)
// 테스트 기간: 날짜 구분 없이 시세 한 벌 — 고치면 모든 날짜에 적용 (서버엔 ALL_KEY 날짜 하나로 저장)

const ALL_KEY='2000.01.01';
const TIERS=[[1000,"black"],[750,"red"],[500,"dia"],[250,"gold"],[100,"silver"],[50,"bronze"]]; // [억, 등급] — 사이트와 같은 기준
const NOTE={'에테르넬 방어구 상자 (상하모견)':'의지·고대·흉수·환상 상자 · 상의·하의·모자·어깨 평균','에테르넬 방어구 상자 (장신망)':'광기·욕망·맹세·갈망 상자 · 장갑·신발·망토 평균'};
const TKO={bronze:'브론즈',silver:'실버',gold:'골드',dia:'다이아',red:'레드',black:'블랙'};
const tierOf=n=>{const v=parseV(S.vals[n]??'');if(v===''||!Number.isFinite(v))return '';const t=TIERS.find(q=>v>=q[0]);return t?t[1]:''};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v==null||v===''?'':String(+v);
const BASE=Object.assign({},...BUILTIN.map(s=>s.p)); // 템마다 가장 최근 기본 시세
const S={pw:'',ok:false,srv:{},vals:{},extra:[],arm:false,busy:false,paste:false,f:'all',sort:'price',q:''};
try{S.pw=sessionStorage.getItem('mepuri-admin')||'';const o=JSON.parse(localStorage.getItem('mepuri-admin-view')||'{}');if(o.sort)S.sort=o.sort}catch(e){}

// ── 서버 ──
let demoDB=null;
async function api(path,body){
  if(DEMO){ // 테스트: 메모리에서 흉내
    if(!demoDB)demoDB=new Map();
    if(path==='/api/loot-prices')return {hist:[...demoDB].map(([d,p])=>({d,p}))};
    if(body.password!=='test')throw new Error('비밀번호가 달라요 (테스트 비밀번호: test)');
    if(path==='/api/admin/login')return {ok:true};
    if(path==='/api/admin/prices'){const p={};Object.entries(body.p).forEach(([k,v])=>{if(v!==''&&v!=null)p[k]=+v});demoDB.set(body.d,p);return {ok:true,count:Object.keys(p).length}}
    if(path==='/api/admin/delete'){demoDB.delete(body.d);return {ok:true}}
  }
  const r=await fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store'}:{cache:'no-store'});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&j.error&&j.error.message)||('서버 오류 '+r.status));
  return j;
}
async function refresh(){try{const j=await api('/api/loot-prices');const h=(j&&j.hist)||[];S.srv=Object.assign({},...h.sort((a,b)=>a.d<b.d?-1:1).map(s=>s.p))}catch(e){toast('시세를 불러오지 못했어요: '+e.message)}}
// 서버 값이 있으면 그걸, 없으면 기본 시세로 칸을 채움
function loadVals(){S.reorder=true;const has=Object.keys(S.srv).length;S.vals={};allNames().forEach(n=>{const v=has?S.srv[n]:BASE[n];S.vals[n]=fmt(v)});S.arm=false}

// ── 목록 ──
const allNames=()=>{const set=new Set([...ITEMS,...Object.keys(BASE),...Object.keys(S.srv),...S.extra]);return [...set]};
const saved=n=>Object.keys(S.srv).length?fmt(S.srv[n]):fmt(BASE[n]);
const noPrice=n=>(S.vals[n]??'')==='';
const noIcon=n=>!ICONS[n];
const numOf=n=>{const v=parseV(S.vals[n]??'');return Number.isFinite(v)&&v!==''?v:-1};
function shownNames(){let a=allNames();
  if(S.f==='nop')a=a.filter(noPrice);else if(S.f==='noi')a=a.filter(noIcon);else if(S.f==='chg')a=a.filter(n=>(S.vals[n]??'')!==saved(n));
  if(S.q){const q=S.q.replace(/\s/g,'');a=a.filter(n=>n.replace(/\s/g,'').includes(q))}
  return a.sort(S.sort==='name'?(x,y)=>x.localeCompare(y,'ko'):(x,y)=>(numOf(y)-numOf(x))||x.localeCompare(y,'ko'))}
// '880', '880억', '1,500억', '12.5' → 억 단위 숫자
const parseV=t=>{const s=String(t).replace(/[,\s]/g,'').replace(/억$/,'');if(s==='')return '';const n=Number(s);return Number.isFinite(n)&&n>=0?n:NaN};

// ── 화면 ──
let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}
const saveView=()=>{try{localStorage.setItem('mepuri-admin-view',JSON.stringify({sort:S.sort}))}catch(e){}};
function rowHTML(n){const v=S.vals[n]??'',c=v!==saved(n),np=v==='',ni=noIcon(n);
  const t=tierOf(n),fx=t?'<span class="gw" aria-hidden="true"></span><span class="gl" aria-hidden="true"><i></i></span><span class="gl2" aria-hidden="true"><i></i></span><span class="sp" aria-hidden="true"></span>':'';
  return `<div class="it${c?' chg':''}${np?' nop':''}"><span class="ic${ni?' no':' sx-ifr'}${t?' '+t:''}" ${ni?'title="아이콘 없음"':''}>${ni?'?':`<img src="${ICONS[n]}" alt="">${fx}`}</span>
    <span class="nmw"><span class="nm" title="${esc(n)}">${esc(n)}</span>${NOTE[n]?`<span class="hint" style="font-size:11px">${NOTE[n]}</span>`:''}${np||ni||t?`<span class="tags">${t?`<span class="tt sx-tv ${t}">${TKO[t]}</span>`:''}${np?'<span class="tag">가격 없음</span>':''}${ni?'<span class="tag">아이콘 없음</span>':''}</span>`:''}</span>
    <input class="inp num" inputmode="decimal" data-n="${esc(n)}" value="${esc(v)}" placeholder="억" aria-label="${esc(n)} 시세 (억)"></div>`}
function render(){
  const app=$('#app');
  const demo=DEMO?'<div class="demo">테스트 화면이에요. 서버 없이 이 창 안에서만 저장돼요. 비밀번호는 <b>test</b>.</div>':'';
  if(!S.ok){app.innerHTML=demo+`<div class="card"><form class="row" id="lf"><span class="lbl">비밀번호</span><input class="inp" id="pw" type="password" autocomplete="current-password" style="flex:1;min-width:160px" value="${esc(S.pw)}"><button class="btn pri" ${S.busy?'disabled':''}>확인</button></form><p class="hint" style="margin:8px 0 0">비밀번호를 넣으면 물욕 시세를 고칠 수 있어요. 시세는 억 메소 단위예요.</p></div>`;
    $('#lf').onsubmit=async e=>{e.preventDefault();S.pw=$('#pw').value;S.busy=true;render();try{await api('/api/admin/login',{password:S.pw});S.ok=true;try{sessionStorage.setItem('mepuri-admin',S.pw)}catch(e){}await refresh();loadVals()}catch(err){toast(err.message)}S.busy=false;render()};
    return}
  const all=allNames(),cNop=all.filter(noPrice).length,cNoi=all.filter(noIcon).length,cChg=all.filter(n=>(S.vals[n]??'')!==saved(n)).length,srvOn=Object.keys(S.srv).length>0;
  if(S.reorder||!S.order){S.order=shownNames();S.reorder=false} // 값을 고칠 때는 줄이 움직이지 않게 순서 고정
  const list=S.order;
  const dot=(k,l,n,w)=>`<button class="dot${S.f===k?' on':''}${w?' w':''}${w&&!n?' zero':''}" data-f="${k}">${l}<span class="num">${n}</span></button>`;
  app.innerHTML=demo+`<div class="mode"><span>ⓘ</span><span><b>테스트 기간이라 날짜 구분 없이 시세 한 벌만 써요.</b> 여기서 고치면 사이트의 모든 날짜 물욕 예상가가 이 값으로 바뀌어요. ${srvOn?'지금 사이트는 <b>여기 저장한 값</b>을 쓰고 있어요.':'아직 저장한 적이 없어서 사이트는 <b>페이지에 들어 있는 비상용 시세</b>를 쓰고 있어요. 칸은 그 값으로 미리 채워 뒀으니, 확인하고 저장하면 그때부터 여기 값이 기준이 돼요.'}</span></div>
    <div class="bar"><div class="dots">${dot('all','전체',all.length)}${dot('nop','가격 없음',cNop,1)}${dot('noi','아이콘 없음',cNoi,1)}${dot('chg','바꾼 것',cChg)}</div>
      <div class="seg" role="group" aria-label="정렬"><button class="${S.sort==='price'?'on':''}" data-s="price">가격순</button><button class="${S.sort==='name'?'on':''}" data-s="name">가나다순</button></div></div>
    <input class="inp srch" id="q" placeholder="템 이름 찾기" value="${esc(S.q)}" style="width:100%">
    <div class="card" style="padding:8px"><div class="head"><span></span><span>아이템</span><span>시세 (억)</span></div>
      <div id="rows">${list.length?list.map(rowHTML).join(''):'<div class="empty">해당하는 템이 없어요</div>'}</div>
      <div class="row" style="padding:10px 12px 4px"><input class="inp" id="newn" placeholder="목록에 없는 템 이름" style="flex:1;min-width:160px"><button class="btn out" id="addn">템 추가</button></div></div>
    <div class="card ${S.paste?'':'hide'}"><textarea class="inp" id="pt" placeholder="한 줄에 하나씩: 템 이름 + 시세 (억)&#10;예) 굶주리는 핏빛 원혼 880&#10;     익셉셔널 해머 (귀고리): 1,500억&#10;JSON {&quot;템&quot;:880} 도 돼요"></textarea><div class="row" style="margin-top:8px"><span class="hint" style="flex:1">붙여넣고 넣기를 누르면 칸이 채워져요. 저장은 따로 눌러야 해요.</span><button class="btn out" id="pgo">넣기</button></div></div>
    <div class="foot"><button class="btn out" id="pst">붙여넣기</button><span class="sp"></span>${srvOn?`<button class="btn danger${S.arm?' arm':''}" id="del">${S.arm?'한 번 더 누르면 지워요':'저장한 값 지우기'}</button>`:''}<button class="btn pri" id="save" ${S.busy?'disabled':''}>저장${cChg?` (${cChg})`:''}</button></div>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.f=b.dataset.f;S.reorder=true;render()});
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.sort=b.dataset.s;S.reorder=true;saveView();render()});
  const q=$('#q');q.oninput=()=>{S.q=q.value.trim();const l=S.order=shownNames();$('#rows').innerHTML=l.length?l.map(rowHTML).join(''):'<div class="empty">해당하는 템이 없어요</div>';bindRows()};
  bindRows();
  $('#addn').onclick=()=>{const n=$('#newn').value.trim();if(!n)return;if(!allNames().includes(n))S.extra.push(n);S.q='';S.f='all';S.reorder=true;render();toast(`${n}을(를) 넣었어요. 시세를 적고 저장해 주세요`)};
  $('#pst').onclick=()=>{S.paste=!S.paste;render();if(S.paste)$('#pt').focus()};
  $('#pgo').onclick=()=>{const t=$('#pt').value;let k=0,bad=[];const put=(n,x)=>{S.vals[n]=fmt(x);if(!allNames().includes(n))S.extra.push(n);k++};
    try{const j=JSON.parse(t);if(j&&typeof j==='object')Object.entries(j).forEach(([n,v])=>{const x=parseV(v);if(Number.isNaN(x)||x==='')bad.push(n);else put(n.trim(),x)})}
    catch(e){t.split(/\n/).forEach(l=>{if(!l.trim())return;const m=l.trim().match(/^(.+?)\s*[:=\t,]?\s*([\d.,]+)\s*억?$/);if(!m){bad.push(l);return}const n=m[1].trim().replace(/[:=,]$/,'').trim(),x=parseV(m[2]);if(!n||Number.isNaN(x)){bad.push(l);return}put(n,x)})}
    S.reorder=true;render();toast(`${k}개 넣었어요${bad.length?` · 못 읽은 줄 ${bad.length}개`:''}`)};
  if($('#del'))$('#del').onclick=async()=>{if(!S.arm){S.arm=true;render();setTimeout(()=>{if(S.arm){S.arm=false;render()}},3000);return}
    try{await api('/api/admin/delete',{password:S.pw,d:ALL_KEY});toast('저장한 값을 지웠어요. 사이트는 페이지의 비상용 시세로 돌아가요');await refresh();loadVals()}catch(e){toast(e.message)}render()};
  $('#save').onclick=async()=>{const p={},bad=[];Object.entries(S.vals).forEach(([n,v])=>{if(v==='')return;const x=parseV(v);if(Number.isNaN(x))bad.push(n);else p[n]=x});
    if(bad.length){toast(`숫자가 아닌 칸이 있어요: ${bad[0]}`);return}
    if(!Object.keys(p).length){toast('저장할 시세가 없어요');return}
    S.busy=true;render();try{const r=await api('/api/admin/prices',{password:S.pw,d:ALL_KEY,p});toast(`시세 ${r.count}개를 저장했어요 · 모든 날짜에 적용돼요`);await refresh();loadVals()}catch(e){toast(e.message)}S.busy=false;render()};
}
function bindRows(){document.querySelectorAll('#rows .inp').forEach(i=>{i.oninput=()=>{S.vals[i.dataset.n]=i.value.trim()};i.onchange=()=>{const y=window.scrollY;render();window.scrollTo(0,y)}})}
render();
</script>
</body>
</html>
