*{box-sizing:border-box}
::-webkit-scrollbar{width:8px;height:8px}

.pret{font-family:"MepuriNum","Noto Sans KR",sans-serif}

/* top bar */
.top{background:var(--top);border-bottom:1px solid var(--top-bd)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:40px}
.logo{font-size:16px;font-weight:800;letter-spacing:.02em;color:var(--logo)}
.top-r{display:flex;align-items:center;gap:12px;min-width:0}
.timers{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:#98A0A9;white-space:nowrap}
.timers b{color:#F1851C;font-weight:500}
.vbar{flex-shrink:0;width:1px;height:14px;background:#49515B}
.top-link{font-size:12px;font-weight:700;color:#B1B9C3}
.top-link[hidden]{display:none}
.top-link[hidden]+.vbar{display:none} /* 테스트 설정을 숨기면 뒤 구분선도 (계정 뒤에 이미 구분선이 있어서 두 개로 보이던 것) */
.fs-bg,.fs-hd{display:none}
@media (max-width:900px){
  .fs-bg{display:block;position:fixed;inset:0;z-index:190;background:rgba(10,14,22,.42)}
  .page.fs-open .col-l>.panel{position:fixed;left:0;right:0;bottom:0;z-index:200;max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom);box-shadow:var(--pop-shadow)}
  .page.fs-open .col-l>.panel>.search,.page.fs-open .col-l .ftabs{display:none}
  .fs-open .fs-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;position:relative}
  .fs-open .fs-hd::before{content:'';position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--border)}
  .fs-open .fs-hd b{font-size:15px;color:var(--text)}
  .page.sxp.fs-open{padding-bottom:86vh} /* 목록 끝 줄도 시트 위로 올려 볼 수 있게 */
}
.theme-btn{display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#B1B9C3;font-size:12px;font-weight:700}
.theme-btn:hover{color:#fff}

/* banner */
.banner{position:relative;overflow:hidden;background:var(--banner);border-bottom:1px solid var(--banner-bd)}
.banner>.bn-glow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.banner>.wrap{position:relative}
.b-ava .ch-glow{position:absolute;left:-20px;bottom:0;pointer-events:none;overflow:visible}
.banner>.bn-glow{overflow:visible}
:root[data-mode="deep"] .bn-glow,:root[data-mode="deep"] .ch-glow{display:none}
.banner .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:80px;flex-wrap:wrap}
.b-left{display:flex;align-items:center;min-width:0}
.b-ava{position:relative;width:110px;height:80px;flex-shrink:0}
.b-ava img{position:absolute;left:22px;bottom:0;width:56px;height:76px;object-fit:contain;object-position:bottom;image-rendering:pixelated}
.b-ava .sil{position:absolute;left:28px;bottom:4px}
.b-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.b-name{display:flex;align-items:center;gap:4px;color:#fff;font-size:16px;font-weight:700;line-height:18px}
.world{padding:0 5px;border-radius:3px;background:rgba(255,255,255,.14);font-size:10px;font-weight:700;line-height:16px}
.b-meta{display:flex;align-items:center;gap:6px;font-size:13px;color:#ADADAD;flex-wrap:wrap}
.b-meta i{width:1px;height:12px;background:rgba(255,255,255,.2)}
.b-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px}
.pill{display:flex;align-items:center;gap:8px;min-width:210px;min-height:28px;padding:0 10px;border-radius:999px;background:var(--pill-bg)}
.pill .v{font-size:14px;font-weight:700;color:#e0e6ed;white-space:nowrap}
.pill .l{margin-left:auto;font-size:11px;color:#9EA3C0;white-space:nowrap}
.coin{position:relative;flex-shrink:0;display:inline-block;border-radius:50%;background:linear-gradient(135deg,#FFE563 50%,#F7CC4A 50%)}
.coin::after{content:'';position:absolute;left:18.75%;top:18.75%;width:62.5%;height:62.5%;border-radius:50%;background:linear-gradient(135deg,#EDB911 50%,#EAAD11 50%)}
.coin.off{background:var(--seg);box-shadow:none}.coin.off::after{background:var(--soft);box-shadow:none}
.b-letter{position:relative;flex-shrink:0;display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#99A1BC 50%,#7C8298 50%)}
.b-letter::before{content:'';position:absolute;inset:1px;border-radius:50%;background:linear-gradient(135deg,#7D849F 50%,#666B83 50%)}
.b-letter b{position:relative;top:.5px;font-family:'MepuriNum','Noto Sans KR',sans-serif;font-size:10px;font-weight:800;line-height:1;color:#F5F2FA;text-shadow:.6px .6px 0 #4A4D60;-webkit-font-smoothing:antialiased}
.refresh{display:grid;place-items:center;width:24px;height:24px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:var(--refresh-bg);color:#fff}
.refresh:hover{background:#65719a}
.name-btn{display:flex;align-items:center;gap:4px;color:#fff;min-width:0;max-width:100%}.name-btn>svg,.b-name>*:not(.b-nm){flex:none}.b-name{min-width:0}.b-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:absolute;z-index:40;min-width:200px;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--card);box-shadow:var(--pop-shadow)}

.dnow b{font-size:15px;color:var(--text)}.dnow small{margin-left:2px;font-size:11px;color:var(--muted)}

.sel.open,.sel:focus-within{border-color:var(--accent)}
.stack{display:flex}
.stack img,.stack .sil-ava{width:20px;height:20px;box-shadow:0 0 0 1.5px var(--card)}
.stack>*+*{margin-left:-6px}
.step{display:flex;flex:1;gap:6px}
.step .v{flex:1;display:flex;align-items:center;height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--input-bd);font-size:13px}
.step .v span{margin-left:auto;font-size:12px;color:var(--muted)}
.sq{display:grid;place-items:center;width:28px;height:28px;flex-shrink:0;border-radius:4px;border:1px solid var(--input-bd);background:var(--card);color:var(--sub)}
.sq:disabled{color:var(--faint)}
.pct{position:relative;width:76px;flex-shrink:0}
.pct input{width:100%;height:28px;padding:0 22px 0 10px;border-radius:4px;border:1px solid var(--input-bd);background:var(--card)}
.pct input:disabled{background:var(--soft);color:var(--muted)}
.pct span{position:absolute;right:8px;top:6px;font-size:12px;color:var(--muted)}
.warn{display:flex;align-items:center;gap:6px;margin:4px 4px 0;padding:8px 10px;border-radius:6px;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:500}
.fbtns{flex-shrink:0;display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.fbtns .btn{flex:1}
.dd{position:absolute;left:0;right:0;top:32px;z-index:35;display:flex;flex-direction:column;border-radius:8px;border:1px solid var(--border);background:var(--card);box-shadow:var(--pop-shadow);overflow:hidden}
.dd .opts{max-height:260px;padding:4px 6px;overscroll-behavior:contain}
.dd-head{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 14px;border-bottom:1px solid var(--border)}
.dd-foot{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border)}
.dd-foot .btn{flex:1;min-width:0;padding:0 8px;font-size:12px}
.prow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 6px;border-radius:6px;text-align:left}
.prow:hover{background:var(--soft)}
.prow.on{background:var(--accent-bg)}
.prow .t{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--text)}
.prow .d{font-size:12px;color:var(--muted)}

/* slot table */
.stable{container:slots/inline-size;display:flex;flex-direction:column;min-height:0}
.sthead,.strow{display:flex;align-items:center;gap:12px}
.sthead{flex-shrink:0}
.stbody{display:flex;flex-direction:column}
.stbody>*{flex-shrink:0}
.grip{display:grid;place-items:center;width:18px;height:32px;margin:0 -3px;border-radius:4px;cursor:grab;touch-action:none}
.grip:hover{background:var(--soft)}.grip:hover svg{fill:var(--sub)}
.strow{transition:transform .15s}
.strow.dragging{position:relative;z-index:3;transition:none;background:var(--card);box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:grabbing}
.bico{width:22px;height:22px;flex-shrink:0;border-radius:4px;object-fit:cover}
.stsec{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:6px;min-height:32px;margin-top:10px;margin-bottom:6px;background:var(--bg);font-size:13px;font-weight:700;color:var(--text)}
.stsec:first-child{margin-top:0}
.stsec .c{font-size:12px;font-weight:500;color:var(--muted)}
.sthead{height:32px;font-size:12px;font-weight:500;color:var(--muted)}
.strow{min-height:64px;margin-bottom:6px;border-radius:9px;border:1px solid var(--card-bd);background:var(--card)}
.c-name{flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--name);word-break:keep-all}
.c-diff{width:76px}.c-party{width:48px;font-size:13px;color:var(--sub);white-space:nowrap}.c-price{width:92px;text-align:right;font-size:13px;font-weight:700;color:var(--price);white-space:nowrap}
.c-act{position:relative;display:flex;gap:4px}
.sthead>.c-act,.strow>.c-act{width:136px;justify-content:flex-end;flex-shrink:0}
.sthead{padding-inline:12px}.strow{padding-inline:12px}.strow.pick{cursor:pointer}.strow.pick:hover{border-color:var(--border2)}
.strow.picked{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.strow.eslot .c-name{font-size:13px;color:var(--muted)}.strow.eslot .es{margin-left:8px;font-size:11px;color:var(--faint)}
.fr.ph{border:1px dashed var(--border2);background:transparent;color:var(--faint)}
.slot-hd{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:8px 10px;border-radius:8px;border:1px dashed var(--border2)}
.slot-hd.ed{border-style:solid;border-color:var(--accent);background:var(--accent-bg)}
.slot-hd>span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}.slot-hd b{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--text)}.slot-hd em{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-style:normal;font-size:12px;color:var(--sub)}
.slot-hd .hd-img{flex-shrink:0;width:40px;height:40px;border-radius:6px;object-fit:cover}
.slot-hd .ph{display:grid;place-items:center;width:40px;height:40px;border-radius:6px;border:1px dashed var(--border2);color:var(--faint)}
.mini-btn.on{background:var(--accent-soft);color:var(--accent)}
.mini-btn{display:grid;place-items:center;width:24px;height:24px;border-radius:4px;color:var(--muted)}
.mini-btn:hover:not(:disabled){background:var(--soft);color:var(--text2)}
.mini-btn:disabled{opacity:.3}

/* reward */
.rw-price{display:flex;align-items:baseline;gap:6px}.rw-price .coin{align-self:center}
.rw-price b{font-size:18px;font-weight:800;color:var(--price)}
.lrow{display:flex;align-items:center;gap:8px;min-height:36px}
.lrow .n{flex:1;min-width:0;font-size:13px;font-weight:500;color:var(--name)}
.lrow .inp{width:84px;flex-shrink:0;padding:0 8px;font-size:12px}
.lrow .lr-del{width:26px;height:26px;flex-shrink:0;margin-left:-4px;color:var(--muted)}
.lrow .n{line-height:18px}

/* dev placeholder */
.dev{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:24px;padding:48px 24px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card);text-align:center}
.dev h2{margin:0;font-size:16px;color:var(--text)}
.dev p{margin:0;font-size:13px;color:var(--muted);line-height:20px}
.dev ul{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.dev li{padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--sub);font-size:12px}

/* modal */
.scrim{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,12,20,.5);overflow-y:auto;overscroll-behavior:contain}
.modal{width:100%;max-width:460px;border-radius:12px;background:var(--bg);border:1px solid var(--frame-bd);box-shadow:0 16px 48px rgba(0,0,0,.3);overflow:hidden}
.m-head{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 12px 0 20px;background:var(--modal-top);color:#fff;font-size:15px;font-weight:700}
.m-head button{display:grid;place-items:center;width:32px;height:32px;border-radius:6px;color:#fff}
.m-body{display:flex;flex-direction:column;gap:10px;padding:16px 20px 20px}
/* 캐릭터 창 (옥션 캐릭터 선택 창 모양) */
.modal.cm{max-width:1048px;border-radius:12px;background:var(--cm-head)}
.cm-head{display:flex;align-items:center;gap:10px;min-height:64px;padding:12px 16px 12px 24px}
.cm-pill-w{position:relative}
.cm-pill{display:flex;align-items:center;gap:8px;width:180px;height:32px;padding:0 12px;border-radius:999px;background:var(--seg);font-size:14px;font-weight:500;letter-spacing:.28px;color:var(--text);text-align:left}
.cm-pill .t{flex:1}
.cm-dd{position:absolute;top:calc(100% + 6px);left:0;z-index:5;display:flex;flex-direction:column;gap:2px;min-width:180px;max-height:320px;overflow-y:auto;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--card);box-shadow:var(--pop-shadow)}
.cm-dd button{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border-radius:6px;font-size:14px;color:var(--text);text-align:left}
.cm-dd button:hover,.cm-dd button.on{background:var(--soft)}
.cm-dd button.on{font-weight:700}
.cm-dd small{margin-left:auto;font-size:12px;color:var(--muted)}
.wicon{width:16px;height:16px;flex-shrink:0;object-fit:contain}
.wicon.ph{display:grid;place-items:center;border-radius:50%;background:var(--seg);font-size:9px;font-weight:800;color:var(--sub);line-height:1}
.cm-cnt{font-size:13px;color:var(--sub)}.cm-cnt b{color:var(--text)}
.cm-edit{margin-left:auto;height:32px;padding:0 14px;border-radius:999px;background:var(--card);font-size:13px;font-weight:700;color:var(--sub)}
.cm-edit.on{background:var(--danger);color:#fff}
.cm-x{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;color:var(--text2)}.cm-x:hover{background:rgba(0,0,0,.06)}
.cm-body{display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 140px);overflow-y:auto;padding:24px;border-radius:12px 12px 0 0;background:var(--card)}
.cm-hint{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger-fg);font-size:12px}
/* 한 줄 6칸 (6×2 = 한 페이지 12칸). 칸 너비를 고정하면 스크롤바 폭만큼 모자라 5칸이 되던 것 고침 */
.cm-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
/* 끝난 파티 고치기: 주마다 체크 */
.modal.pfix{max-width:480px}
.pf-wh{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px}.pf-wh .flbl{font-size:13px;font-weight:600;color:var(--text2)}
.pf-weeks{display:flex;flex-direction:column;max-height:216px;overflow-y:auto;margin-bottom:12px;border:1px solid var(--border);border-radius:8px}
.pf-wk{display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 12px;border-bottom:1px solid var(--border);cursor:pointer}.pf-wk:last-child{border-bottom:0}
.pf-wk input{flex:none;width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer}
.pf-wk .w{flex:none;font-size:13px;font-weight:600;color:var(--text)}.pf-wk:not(.on) .w{color:var(--muted)}
.pf-wk .cur{flex:1;min-width:0;font-size:12px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:920px){.cm-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cm-card{position:relative;display:flex;flex-direction:column;min-height:200px;border-radius:8px;border:1px solid var(--border);background:var(--cm-card);transition:border-color .15s}
.cm-card:hover{border-color:var(--accent)}
.cm-pick{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 12px;border-radius:8px;text-align:center}
.cm-pic{display:grid;place-items:end center;width:100%;height:112px;margin-bottom:8px}
.cm-pic img{max-width:120px;max-height:112px;object-fit:contain;image-rendering:pixelated}
.cm-pic img.look{width:96px;height:96px;max-width:none;object-fit:none;object-position:50% 54%;margin-bottom:-6px}
.cm-sil{opacity:.5}
.ava.jill{object-fit:cover;object-position:50% 8%;image-rendering:auto}
.b-ava img.jill{left:4px;bottom:0;width:92px;height:96px;object-fit:contain;object-position:bottom;image-rendering:auto}
.cm-pic img.jill{width:110px;height:112px;max-width:none;max-height:none;object-fit:contain;object-position:bottom;image-rendering:auto}
.cm-card b{font-size:14px;font-weight:700;color:var(--name)}
.cm-card small{font-size:11px;color:var(--muted)}
.cm-card.on{background:var(--cm-on);border-color:var(--cm-on)}
.cm-card.on b{color:#fff}
.cm-hides{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 8px 10px}
.cm-hides button{height:24px;border-radius:6px;border:1px solid var(--border);background:var(--card);font-size:11px;font-weight:600;color:var(--sub)}
.cm-hides button:hover{border-color:var(--border2)}
.cm-hides .cm-chs{grid-column:1/-1;position:relative}
.cm-hides .cm-chal{display:flex;align-items:center;justify-content:center;gap:3px;width:100%}
.cm-hides .cm-chal svg{flex:none;opacity:.7}
.cm-hides .cm-chal.lock{cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;padding:0 4px}
.modal:has(.mn-dd){overflow:visible}.modal:has(.mn-dd) .m-head{border-radius:12px 12px 0 0} /* 직접 입력 목록이 창 끝에서 잘리지 않게 */
.sec .c,.sec-t{white-space:nowrap}
@media (max-width:560px){.sec.fold:has(.sec-wk){flex-wrap:wrap;row-gap:4px;padding-block:6px}.sec.fold:has(.sec-wk) .sec-wk{order:10;flex-basis:100%;margin-left:20px}} /* 지난 주 보기: 주차 표시는 둘째 줄로 */.cm-hides .cm-chal.lock:not(.on){border-style:dashed;color:var(--muted)}
.cm-hides .cm-chal.on{border-color:transparent;background:linear-gradient(120deg,var(--ch),var(--chm) 45%,var(--ch2)) border-box;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.cm-hides .cm-chal.on svg{fill:#fff;opacity:.85}
.cm-chs-pop{position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:6;display:flex;flex-direction:column;gap:2px;padding:3px;border-radius:8px;border:1px solid var(--border);background:var(--card);box-shadow:var(--pop-shadow)}
.cm-hides .cm-chs-pop .opt{height:auto;min-height:26px;border:0;border-radius:5px;background:none;justify-content:center;padding:0 8px;font-size:12px;font-weight:700;color:var(--sub)}
.cm-hides .cm-chs-pop .opt:hover{background:var(--soft)}
.cm-chs-pop .opt[style] span{background:linear-gradient(100deg,var(--chm),var(--ch2));-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme="dark"] .cm-chs-pop .opt[style] span{background-image:linear-gradient(100deg,var(--ch),var(--chm))}
.cm-hides .cm-chs-pop .opt.on{background:var(--soft);color:var(--text)} /* 고른 줄: 시즌은 그 시즌 색으로 꽉 채우고, '아님'은 회색 */
.cm-hides .cm-chs-pop .opt.on[style]{background:linear-gradient(120deg,var(--ch),var(--chm) 45%,var(--ch2)) border-box}
.cm-chs-pop .opt.on[style] span{background:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.cm-hides button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.cm-card.hid .cm-pick{opacity:.35}.cm-card.on small{color:rgba(255,255,255,.85)}
.cm-card.edit{animation:none;border-style:dashed}
.cm-card.edit .cm-pick{cursor:default}
.cm-pen{position:absolute;top:8px;left:8px;z-index:2;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--sub);box-shadow:0 2px 6px rgba(0,0,0,.12)}.cm-pen:hover{color:var(--accent);border-color:var(--accent)}
.cm-del{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cm-del:hover{background:var(--danger-hover)}
.cm-add{align-items:center;justify-content:center;gap:6px;min-height:200px;border-style:dashed;border-color:var(--border2);background:transparent;color:var(--sub)}
.cm-add b{margin-top:6px;font-size:14px;color:var(--sub)}
.cm-pages{display:flex;justify-content:center;gap:6px;padding-top:4px}
.cm-pages button{min-width:28px;height:28px;padding:0 8px;border-radius:6px;font-family:"MepuriNum","Noto Sans KR",sans-serif;font-size:12px;font-weight:600;color:var(--sub)}
.cm-pages button.on{border:1px solid var(--accent);background:var(--card);color:var(--accent)}
.cm-pages button:disabled{opacity:.35}
.info{display:flex;align-items:center;gap:6px;min-height:36px;padding:8px 12px;border-radius:8px;border:1px solid var(--info-bd);background:var(--info-bg);color:var(--info-fg);font-size:12px}
.m-search{display:flex;gap:6px}
.m-search .search{flex:1;min-width:0}.m-search .search input{min-width:0;width:100%}
.m-search .btn{height:36px;min-width:72px}
.found{display:flex;align-items:center;gap:14px;padding:12px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card)}
.found .pic{position:relative;display:grid;place-items:end center;width:84px;height:92px;flex-shrink:0;border-radius:8px;background:var(--avatar-bg);overflow:hidden}
.found .pic img{width:64px;height:86px;object-fit:contain;object-position:bottom;image-rendering:pixelated}
/* 넥슨 API 외형 이미지(96×96, 여백 포함)는 원본 크기 그대로 */
.found .pic img.look{width:96px;height:96px;flex-shrink:0;object-fit:none;object-position:50% 54%;margin-bottom:-6px}
.b-ava img.look{left:2px;bottom:-6px;width:96px;height:96px;object-fit:none;object-position:50% 54%}
/* 넥슨 원본 그림(.look): 지금은 300×300 안에 캐릭터 발끝이 (150, 200). 그 둘레만 보이게 (예전 96×96 원본도 그대로 맞음)
   목록 동그라미는 92×92 범위(세로 112~204)를 34px로 줄여서 (zoom) — 칩처럼 더 작은 곳은 --z로 */
.ava.look{width:92px!important;height:92px!important;object-fit:none;object-position:50% 53.8%;zoom:var(--z,.37)}
/* 고정 배율로 자른 그림(.fx): 넥슨 원본에서 발끝 기준으로 늘 같은 범위(가로 60~240, 세로 70~210 → 180×140, 발끝 (90,131))
   → 모든 캐릭터가 같은 배율로 보임. 칸마다 배율만 다름: 보스현황 0.85배, 헤더·캐릭터 선택 1배, 동그라미 0.4배(몸 전체 85×85 → 34px, 더 작은 곳은 --zf) */
.b-ava img.fx{left:0;bottom:0;width:129.4px;height:94.1px;zoom:.85;object-fit:none;object-position:-31.2px -38px}
.found .pic img.fx{width:84px;height:92px;object-fit:none;object-position:-48px -43px}
.cm-pic img.fx{width:120px;height:112px;max-width:none;max-height:none;object-fit:none;object-position:-30px -23px}
.ava.fx{width:85px!important;height:85px!important;object-fit:none;object-position:-47.5px -49px;zoom:var(--zf,.4)}
.keybox{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:8px;border:1px dashed var(--border2);background:var(--card)}
.keyrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:500;color:var(--sub)}
.keyrow small,.khint{font-size:11px;font-weight:400;color:var(--muted)}
.keyrow.on{justify-content:flex-start;padding:0 2px;color:var(--teal-fg)}.keyrow.on .linkish{margin-left:auto}
.kdot{width:7px;height:7px;border-radius:50%;background:var(--teal-fg)}
.keybox .m-search .search{min-height:32px}.keybox .m-search input{height:30px;font-size:13px}.keybox .m-search .btn{height:32px}
.note.gout{gap:6px;border-color:var(--accent);background:var(--card)}.note.gout h3{font-weight:700;color:var(--text)}.gout-b{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-top:4px}.gout-b .btn{height:32px;padding:0 14px}
.m-err{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;border-radius:6px;background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger-fg);font-size:12px;line-height:18px}
.m-err svg{flex-shrink:0;margin-top:2px}
.found .ok{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--teal-fg)}

.sx-stbox{margin-bottom:6px}
/* 기간 바: 보스 설정 검색창과 같은 모양 한 줄 (단위 고르기 + 기간 이동) */
.sx-pbar{min-height:36px;gap:2px;padding:0 4px 0 6px;border-radius:8px;border:1px solid var(--border2);background:var(--card)}
.sx-pbar>button{width:28px;height:28px;font-size:16px}
.sx-pl b{font-size:14px}
.sx-unit{position:relative;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 6px;border-radius:6px;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;white-space:nowrap}
.sx-unit svg{color:var(--muted)}
.sx-unit select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
@media (hover:hover){.sx-unit:hover{background:var(--soft)}}
.sx-psep{width:1px;height:16px;margin:0 2px;background:var(--border2)}
.sx-db .dwrap{flex:1;justify-content:center}
.sx-dnow{position:relative;cursor:pointer}.sx-dnow b{font-size:15px}
.sx-dnow select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
/* 기간 고르기 달력 */
.sx-cal{width:300px;display:flex;flex-direction:column;gap:8px}
.sx-calt{margin:0;align-self:stretch}.sx-calt button{flex:1}
.sx-cal .cal-h{margin:0}
.sx-wh{display:grid;grid-template-columns:repeat(7,1fr);padding:0 6px}.sx-wh em{font-style:normal;text-align:center;font-size:11px;color:var(--muted)}
.sx-wh em:nth-child(4){color:#E0475B}.sx-wh em:nth-child(3){color:#3F6FCF}
.sx-wks{display:flex;flex-direction:column;gap:2px}
.sx-wk{position:relative;display:grid;grid-template-columns:repeat(7,1fr);align-items:center;height:32px;padding:0 6px;border-radius:6px;font-size:13px;color:var(--text2)}
.sx-wk span{text-align:center}.sx-wk span.out{color:var(--faint)}
.sx-wk:disabled{opacity:.35}
@media (hover:hover){.sx-wk:not(:disabled):not(.on):hover{background:var(--accent-bg)}}
.sx-wk.real{box-shadow:inset 0 0 0 1px var(--border2);font-weight:700}
.sx-wk.on{background:var(--accent);color:#fff;font-weight:700}.sx-wk.on span.out{color:rgba(255,255,255,.6)}
.sx-wk i,.sx-mg button i{position:absolute;right:6px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:3px;background:#4AA5D6}
.sx-wk.on i,.sx-mg button.on i{background:#fff}
.sx-mg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.sx-mg button{position:relative;height:40px;border-radius:6px;font-size:13px;font-weight:600;color:var(--text2)}
.sx-mg button:disabled{opacity:.35}
@media (hover:hover){.sx-mg button:not(:disabled):not(.on):hover{background:var(--accent-bg)}}
.sx-mg button.real{box-shadow:inset 0 0 0 1px var(--border2)}.sx-mg button.on{background:var(--accent);color:#fff}
.sx-yg{grid-template-columns:1fr 1fr}
.sx-dnow{border:0;background:none}
/* 날짜 바 안의 버튼 규칙(.datebar button)을 달력 안에서는 되돌림 */
.datebar .sx-wk{display:grid;grid-template-columns:repeat(7,1fr);justify-content:stretch;gap:0;height:32px;padding:0 6px;font-size:13px;font-weight:500;color:var(--text2)}
.datebar .sx-wk span{font-size:13px;font-weight:inherit}
.datebar .sx-wk.real{font-weight:800}.datebar .sx-wk.on{color:#fff;font-weight:700}
.datebar .sx-mg button{display:block;height:40px;padding:0;font-size:13px;font-weight:600;color:var(--text2)}.datebar .sx-mg button.on{color:#fff}
.datebar .sx-calt button{height:26px;padding:0 10px;font-size:12px;font-weight:600;color:var(--sub)}.datebar .sx-calt button.on{color:var(--text2);font-weight:700}
.datebar .sx-cal .cal-h button{padding:0}
.datebar .sx-wk{padding:0 12px 0 6px}.sx-wk i{right:3px}.sx-wh{padding:0 12px 0 6px}
/* 주간 전용 달력: 한 줄 = 한 주 (n주차 · 목~수 · 그 주 수익) */
.sx-wl{display:flex;flex-direction:column;gap:3px}
.datebar .sx-wrow,.pf-cal .sx-wrow{position:relative;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:500;color:var(--text2);text-align:left;justify-content:stretch}
.datebar .sx-wrow span,.pf-cal .sx-wrow span{font-size:13px;font-weight:500;color:var(--sub)}
.sx-wrow b{font-weight:700}.sx-wrow em{font-style:normal;font-size:12px;font-weight:700;color:var(--price)}
.sx-wrow:disabled{opacity:.35}
@media (hover:hover){.sx-wrow:not(:disabled):not(.on):hover{border-color:var(--accent)}}
.sx-wrow.real{box-shadow:inset 0 0 0 1px var(--border2)}.sx-wrow.real em{color:var(--accent)}
.datebar .sx-wrow.on,.pf-cal .sx-wrow.on{background:var(--accent);border-color:var(--accent);color:#fff}.datebar .sx-wrow.on span,.pf-cal .sx-wrow.on span,.sx-wrow.on em{color:#fff}
.sx-mg button.act{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent-soft)}
.sx-msh{display:flex;flex-direction:column;gap:4px;padding:6px 10px;border-radius:8px;background:var(--soft)}
.sx-msh .frow{min-height:30px}.sx-mn{width:auto;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.sx-msh .sx-pct input::placeholder{color:var(--faint)}
.sx-warn{font-size:11px;font-weight:600;color:var(--danger-fg)}
/* 결정 분배 표: 이름·몫을 표 안에서 바로 적음 */
.sx-gsplit .sx-sr{grid-template-columns:1fr 84px 96px;min-height:36px}
.sx-gname{width:100%;height:28px;padding:0 8px;font-size:13px}
.sx-gsplit .sx-pct{justify-content:flex-end}.sx-gsplit .sx-pct input{width:58px;height:28px}
.sx-gsplit .sx-pct input:disabled{opacity:1;background:transparent;border-color:transparent;color:var(--text2)}
.sx-gsplit .sx-warn,.sx-gsplit .sx-hint{margin-top:4px}
.sx-pn{color:var(--accent);font-weight:600}.sx-arow.picked .sx-pn{color:var(--accent)}
.sx-pname{flex:1;height:30px;margin-left:auto}
/* 막대 폭 줄임, 보스별 표는 난이도마다 한 줄로 촘촘하게 */
.sx-stk{max-width:22px}
.sx-brow2{min-height:44px}.sx-brow2 .fr.s32{width:32px;height:32px}.sx-brow2 .c-name{font-size:14px}
.sx-brow2 .sx-dk .dk{transform:scale(.9);transform-origin:left center}
.sx-table .sx-bhead>span:first-child{width:32px!important}
.fr.s32 img{width:26px;height:26px;border-radius:2px}
@media (max-width:560px){.sx-brow2 .sx-dk{display:flex;width:auto}.sx-brow2 .c-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
@media (max-width:560px){
  .sx-brow2{display:grid;grid-template-columns:32px 1fr 1fr 1fr;grid-template-rows:auto auto;column-gap:8px;row-gap:2px;padding-block:6px}
  .sx-brow2>.fr{grid-row:1/3;grid-column:1;align-self:center}
  .sx-brow2>.c-name{grid-row:1;grid-column:2/4}
  .sx-brow2>.sx-dk{grid-row:1;grid-column:4;justify-content:flex-end}
  .sx-brow2>.sx-n{grid-row:2;grid-column:2;width:auto;text-align:left;font-size:12px}.sx-brow2>.sx-n::before{content:'클리어 ';color:var(--muted)}
  .sx-brow2>.sx-m{grid-row:2;width:auto;min-width:0;font-size:12px}
  .sx-brow2>.sx-m:nth-of-type(4){grid-column:3}.sx-brow2>.sx-m:last-child{grid-column:4}
  .sx-table .sx-bhead{display:none}
}

/* 좁은 폭에서 이름이 잘리지 않게: 판매·몫 칸이 먼저 줄고, 더 좁으면 태그를 숨김 */
.sx-table{container:sxt/inline-size}
.sx-arow{padding-block:8px}
.sx-arow .c-name{flex:1 1 auto;min-width:150px}
.sx-tg{flex:0 1 170px;min-width:0}
@container sxt (max-width:560px){.sx-tg{display:none}.sx-bhead .sx-tg{display:none}.sx-arow .c-name{min-width:0}}
/* 폰: 선택 테두리에 글자·아이콘이 붙지 않게 줄 안쪽 여백 유지 */
.sx-table .sx-bhead,.sx-table .sx-brow{padding-inline:8px}
/* 좁은 폭 물욕 목록: 예상가·내 수익을 한 칸에 위아래로 (겹침 방지) */
@container sxt (max-width:460px){
  .sx-auc .sx-arow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;row-gap:2px}
  .sx-auc .sx-arow>.sx-ifr,.sx-auc .sx-arow>.sx-ifr2{grid-row:1/3;grid-column:1}
  .sx-auc .sx-arow>.c-name{grid-row:1/3;grid-column:2}
  .sx-auc .sx-arow>.sx-m{grid-column:3;width:auto;min-width:0;justify-self:end}
  .sx-auc .sx-arow>.sx-m:last-child{grid-row:1;align-self:end;font-size:14px}
  .sx-auc .sx-arow>.sx-m:nth-last-child(2){grid-row:2;align-self:start;font-size:12px;font-weight:500;color:var(--muted)}
  .sx-auc .sx-arow>.sx-m:nth-last-child(2)::before{content:'예상 ';font-weight:400}
  .sx-auc .sx-arow>.sx-m:nth-last-child(2) .coin{display:none}
  .sx-auc .sx-bhead>:nth-last-child(2){display:none}
}
@container sxt (max-width:460px){
  .sx-auc .sx-arow>.sx-m:nth-last-child(2):has(>.sx-z)::before{content:none}
  .sx-auc .sx-arow.pend>.sx-m:nth-last-child(2){visibility:hidden}
}
/* 좁은 폭 결정 분배 목록: 클리어 수 칸을 빼서 이름·난이도가 잘리지 않게 */
@container sxt (max-width:460px){
  .sx-table:not(.sx-auc) .sx-arow>.sx-n,.sx-table:not(.sx-auc) .sx-bhead>.sx-n{display:none}
  .sx-table:not(.sx-auc) .sx-arow>.sx-m{width:auto;min-width:0}
  .sx-arow .c-name b .dk{flex-shrink:0}
}

.sx-spin{flex:1;min-width:0;max-width:200px;margin-left:auto;text-align:right;font-weight:700}
.sx-spv{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-top:-4px;text-align:right}.sx-spv b{min-height:18px;font-size:13px;font-weight:700;color:var(--accent)}.sx-spv b.bad{color:var(--danger)}.sx-spv span{font-size:11px;color:var(--muted);line-height:15px}
.sx-stl b{color:var(--danger)!important}.sx-stl.get b{color:var(--good,#2BA56B)!important}.sx-stl.done b{color:var(--muted)!important;text-decoration:line-through}
.sx-sdone{align-items:center}.sx-sdone>span{font-size:12px;color:var(--muted)}.sx-sdone .tg-lbl{margin-left:auto;font-size:13px;font-weight:700;color:var(--sub)}
.sx-sr:not(:has(> :nth-child(3))){grid-template-columns:1fr auto}
/* 혼자 튀는 막대: 물결로 자름 */
.sx-stk.cut{position:relative}
.sx-brk{position:absolute;left:-2px;right:-2px;height:9px;margin-top:-4px;pointer-events:none}
.sx-brk svg{display:block;width:100%;height:100%}.sx-brk path{fill:var(--card)}

/* 옥션 맞춤: 수익 기록 표도 줄마다 떨어진 카드. 보여줄 게 많아서 보스 현황(줄 64 · 아이콘 48)보다 작게: 줄 48 · 아이콘 36 */
.sx-table{padding:0}
.sx-table .sx-bhead{border-bottom:0}
.sx-table .sx-brow{min-height:64px;margin-bottom:6px;padding:7px 12px;border:1px solid var(--card-bd);border-radius:9px;background:var(--card)}
.sx-table .sx-bbody>.sx-brow:last-child{border-bottom:1px solid var(--card-bd)}
.sx-table .sx-brow2{min-height:48px;margin-bottom:5px;padding:5px 12px;border-radius:8px}
.sx-table .sx-brow2 .c-name{font-size:14px;line-height:20px}
.sx-table .fr.s32,.sx-table .sx-brow2 .fr.s32{width:36px;height:36px;border-radius:5px;border-color:var(--border)!important}
.sx-table .fr.s32 img{width:34px;height:34px;max-width:none;max-height:none;border-radius:4px}
.sx-table .fr.s32 .flag{top:-6px;left:-1px;width:15px;height:17px;padding-top:2px;font-size:9px;line-height:10px;border-radius:3px 3px 0 0}
.sx-table .sx-bhead>span:first-child{width:48px!important}.sx-bt .sx-bhead>span:first-child{width:36px!important}
/* 구역 띠 안 열 이름 (보스 설정 표와 같은 방식) */
.sx-bt .sthd{gap:12px}.sx-bt .sthd>.sx-dk,.sx-bt .sthd>.sx-n,.sx-bt .sthd>.sx-m{font-size:12px;font-weight:500;color:var(--muted)}
.sx-bt .sthd .fold-i{margin-left:4px}
.sx-table .stsec{margin-top:8px;margin-bottom:5px}
.sx-arow:hover{border-color:var(--border2)}
@media (max-width:560px){.sx-table .sx-brow2{grid-template-columns:36px 1fr 1fr 1fr;padding:5px 8px}}

@media (max-width:560px){.sx-bt .sthd>.sx-dk,.sx-bt .sthd>.sx-n,.sx-bt .sthd>.sx-m{display:none}.sx-bt .sthd .fold-i{margin-left:auto}}
/* 수익 기록 표는 띠가 위에 붙지 않으니 아래 덮개(그림자) 없음 — 있으면 바로 아래 카드 윗선을 가림 */
.sxp .stable .stsec.fold,.sxp .stable .stsec.band{box-shadow:none}

/* 열 이름과 아래 값은 칸 가운데 정렬 (칸 폭 고정) — 이름 길이에 따라 밀리지 않게 */
.sx-table .sx-dk,.sx-table .sx-n,.sx-table .sx-m,.sx-table .sx-tg{flex:0 0 auto;text-align:center;justify-content:center}
.sx-table .sx-tg{flex:0 0 170px}
.sx-auc .sx-m{justify-content:center}
.sx-bt .sx-fx{flex:0 0 20px;display:flex;justify-content:flex-end}
.sx-bt .sthd .fold-i{margin-left:0}
@media (max-width:560px){.sx-bt .sx-brow2>.sx-fx{display:none}.sx-bt .sthd>.sx-fx{margin-left:auto}}

/* 수익 기록 보스 표: 막대 목록 (보스 · 난이도 | 클리어 | 결정석+물욕 막대 | 합계) */
.sx-bt .sx-brow3{min-height:48px;margin-bottom:5px;padding:5px 12px;border-radius:8px;gap:12px}
.sx-bt .sx-brow3 .c-name{flex:0 0 210px;min-width:0;display:flex;align-items:center;gap:6px;font-size:14px;line-height:20px}
.sx-bt .sx-brow3 .c-name b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--name)}
.sx-bt .sx-brow3 .c-name .dk{flex-shrink:0}
.sx-bt .sx-cnt{flex:0 0 40px;text-align:center;font-size:12px;color:var(--sub)}
.sx-bt .sx-hb{flex:1;min-width:40px;height:12px;border-radius:6px;background:var(--soft);display:flex;overflow:hidden}
.sx-bt .sx-hb i{display:block;flex:0 0 auto;height:100%}
.sx-bt .hg{background:#4AA5D6}.sx-bt .hl{background:repeating-linear-gradient(135deg,#E0588A 0 3px,#F6A5C4 3px 6px)}
.sx-bt .sx-tot{flex:0 0 110px;text-align:right;font-size:13px;font-weight:700;color:var(--price);white-space:nowrap}.sx-bt .sx-tot.z{font-weight:400;color:var(--faint)}
.sx-bt .sx-lgd{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:12px;font-size:12px;font-weight:500;color:var(--muted)}
.sx-bt .sx-lgd>span{display:flex;align-items:center;gap:5px}
.sx-bt .sx-sw{width:12px;height:8px;border-radius:2px;display:inline-block}
/* 폰: 2줄 (이름·난이도 | 합계 / 막대 | 클리어) */
@media (max-width:560px){
  .sx-bt .sx-brow3{display:grid;grid-template-columns:36px minmax(0,1fr) 84px;grid-template-rows:auto auto;column-gap:10px;row-gap:5px;padding:6px 10px}
  .sx-bt .sx-brow3>.fr{grid-row:1/3;grid-column:1;align-self:center}
  .sx-bt .sx-brow3>.c-name{grid-row:1;grid-column:2;flex:none}
  .sx-bt .sx-brow3>.sx-tot{grid-row:1;grid-column:3;flex:none}
  .sx-bt .sx-brow3>.sx-hb{grid-row:2;grid-column:2;height:8px;align-self:center}
  .sx-bt .sx-brow3>.sx-cnt{grid-row:2;grid-column:3;flex:none;text-align:right}
  .sx-bt .sx-brow3>.sx-fx{display:none}
}

/* 팔았는데 판매가를 안 적은 물욕: 예상가 옆 작은 점 + 입력칸 테두리 살짝 (예상가로 계산 중이라는 뜻) */
.sx-nosp{display:inline-block;flex:none;width:5px;height:5px;margin-right:6px;border-radius:50%;background:var(--accent);opacity:.75;vertical-align:middle}
.sx-spin.need{border-color:rgba(246,134,0,.5)}.sx-spin.need::placeholder{color:var(--accent);opacity:.6}

/* 파티 목록: 열 이름은 주간/월간 띠 안에 (따로 머리줄 없음) */
.sx-ptab .stsec.sthd>:is(.sx-tg,.sx-n,.sx-pr){font-size:12px;font-weight:500;color:var(--muted)}
.sx-ptab .stsec.sthd>.sx-tg{justify-content:center}
.sx-ptab .sx-fx{flex:0 0 20px;display:flex;justify-content:flex-end}
/* 수익 통계 개편: 그래프 머리(단위 · 창 넘기기), 막대 누르기, 요약 */
.sx-gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sx-gh .sx-mseg{margin:0}
.sx-gnav{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
.sx-gnav button{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;font-size:15px;color:var(--sub)}
.sx-gnav button:hover:not(:disabled){background:var(--soft);color:var(--text)}.sx-gnav button:disabled{opacity:.3;cursor:default}
.sx-gnav b{font-size:13px;color:var(--text2)}
.sx-gh .sx-s{margin-left:auto}
.sx-bar.pick{cursor:pointer;border-radius:6px}
@media (hover:hover){.sx-bar.pick:not(.on):hover{background:var(--soft)}}
.sx-bar.pick:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sx-subrow{min-height:24px}.sx-subrow .flbl{padding-left:6px;font-size:12px;color:var(--muted)}.sx-subrow .sx-fv b{font-size:12px;font-weight:600;color:var(--sub)}
.sx-est{color:var(--muted)!important}
.sx-up{color:#E0475B}.sx-down{color:#3F6FCF}
.sxp .fsec .flbl{white-space:nowrap}
.sx-dl{display:block;margin:-2px 0 6px;font-size:12px;color:var(--muted)}.sx-dl b{font-weight:700}
.sx-bar .sx-bv{position:relative}.sx-xn{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:2px;white-space:nowrap;padding:0 4px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-style:normal;font-size:9px;font-weight:800}
.sx-gh .sx-vo{position:relative;margin-left:auto}
.sx-vol{padding:4px 12px 2px;font-size:11px;font-weight:500;color:var(--muted)}
.sx-vom button{height:32px;font-size:13px}
.sx-vom .cb{display:grid;place-items:center;width:16px;height:16px;border-radius:4px;border:1px solid var(--border2)}.sx-vom .cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* 수익 통계 위 요약 (합계 · 결정석 · 물욕) */
.sx-kpi{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.sx-k{display:flex;flex-direction:column;gap:3px;min-width:0;padding:12px 16px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card)}
.sx-kl{font-size:12px;font-weight:500;color:var(--muted)}.sx-kl small{margin-left:4px;font-size:11px;color:var(--faint)}
.sx-k>b{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--text);white-space:nowrap}
.sx-k.main>b{font-size:19px}
.sx-k>small,.sx-k .sx-dl{margin:0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.sx-kpi{grid-template-columns:1fr 1fr}.sx-k.main{grid-column:1/3}}

    else if(t==='W'&&sell&&!isSeason(s.boss))left+=notYet(s.boss,TODAY,s.diff)?0:myPrice(s)||0}); // 출시 전 보스도 안 넣음 // 시즌 보스는 남은 주간 수에도 금액에도 안 넣음
  // 이번 주에 깨고 목록에서 뺀 보스도 이번 주 수익에는 넣음 (수익 관리와 같은 숫자)

  return{earned:eD+eW+eM,eD,eW,eM,left,D:cnt('D'),W:cnt('W'),M:cnt('M')};
}

/* ---------- 꾹 눌러서 순서 바꾸기 (캐릭터 목록·편집 창) ----------
   터치·펜: 0.5초 꾹 누른 뒤 끌기 (그 전에 10px 넘게 움직이면 그냥 스크롤) / 마우스: 누른 채 6px 넘게 끌면 바로
   끄는 동안 다른 칸은 자리를 비켜 주고(FLIP), 놓으면 done(새 id 순서) — 그냥 누른 건 원래 클릭 그대로 */
function dragSort(box,sel,done){
  if(!box||box._ds)return;box._ds=1;let d=null;
  const items=()=>[...box.querySelectorAll(sel)];
  const lay=el=>{const b=box.getBoundingClientRect();return {l:b.left+box.clientLeft+el.offsetLeft-box.scrollLeft,t:b.top+box.clientTop+el.offsetTop-box.scrollTop,w:el.offsetWidth,h:el.offsetHeight}}; // 옮기는 중(transform)과 상관없는 제자리
  const place=()=>{const L=lay(d.el);d.el.style.transform=`translate(${d.x0+d.px-d.sx-L.l}px,${d.y0+d.py-d.sy-L.t}px)`};
  const hit=()=>{for(const s of items()){if(s===d.el)continue;const L=lay(s);if(d.px>=L.l&&d.px<=L.l+L.w&&d.py>=L.t&&d.py<=L.t+L.h){
      const all=items(),before=new Map(all.map(x=>[x,x.getBoundingClientRect()]));
      const a=all.indexOf(d.el),b=all.indexOf(s);if(b>a)all.slice(a+1,b+1).forEach(x=>d.el.before(x));else all.slice(b,a).reverse().forEach(x=>d.el.after(x)); // 끄는 칸은 그대로 두고 사이 칸들을 반대편으로 (끄는 칸을 떼면 포인터를 놓쳐서)
      all.forEach(x=>{if(x===d.el)return;const a=before.get(x),b=x.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;if(!dx&&!dy)return;
        x.style.transition='none';x.style.transform=`translate(${dx}px,${dy}px)`;x.offsetWidth;x.style.transition='transform .16s';x.style.transform=''});
      d.moved=true;break}}place()};
  const auto=()=>{const tick=()=>{if(!d||!d.on)return;const b=box.getBoundingClientRect(),E=40;let v=0;
      if(box.scrollHeight>box.clientHeight+1){if(d.py<b.top+E)v=-Math.ceil((b.top+E-d.py)/5);else if(d.py>b.bottom-E)v=Math.ceil((d.py-(b.bottom-E))/5)}
      if(v){box.scrollTop+=Math.max(-16,Math.min(16,v));hit()}d.raf=requestAnimationFrame(tick)};d.raf=requestAnimationFrame(tick)};
  const go=()=>{d.on=true;clearTimeout(d.tm);const r=d.el.getBoundingClientRect();d.x0=r.left;d.y0=r.top;
    if(getComputedStyle(box).position==='static'){box.style.position='relative';d.pos=1}
    box.classList.add('ds-on');d.el.classList.remove('ds-hold');d.el.classList.add('ds-drag');try{d.el.setPointerCapture(d.pid)}catch(_){}try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}place();auto()};
  const end=ok=>{if(!d)return;const x=d;d=null;clearTimeout(x.tm);cancelAnimationFrame(x.raf);x.el.classList.remove('ds-hold');
    if(!x.on)return;box._dsAt=Date.now();if(x.pos)box.style.position='';box.classList.remove('ds-on');x.el.classList.remove('ds-drag');
    items().forEach(i=>{i.style.transition='';i.style.transform=''});
    const ids=items().map(i=>i.dataset.dsid);if(ok&&x.moved&&ids.join()!==x.ids0.join())done(ids);else if(x.moved)render()}; // 취소면 원래 순서로 다시 그림
  box.addEventListener('pointerdown',e=>{if(e.button>0||d)return;const el=e.target.closest(sel);if(!el||!box.contains(el))return;const ctl=e.target.closest('button,a,input,select,label,summary');if(ctl&&ctl!==el&&!ctl.classList.contains('cm-pick'))return; // 칸 안의 다른 버튼(숨김·×·챌린저스…)은 그대로 누르기
    d={el,pid:e.pointerId,mouse:e.pointerType==='mouse',sx:e.clientX,sy:e.clientY,px:e.clientX,py:e.clientY,on:false,moved:false,ids0:items().map(i=>i.dataset.dsid)};
    if(!d.mouse){el.classList.add('ds-hold');d.tm=setTimeout(()=>{if(d&&d.el===el)go()},500)}});
  box.addEventListener('pointermove',e=>{if(!d||e.pointerId!==d.pid)return;d.px=e.clientX;d.py=e.clientY;const far=Math.hypot(d.px-d.sx,d.py-d.sy);
    if(!d.on){if(d.mouse){if(far>6)go();else return}else{if(far>10)end(false);return}}
    e.preventDefault();hit()});
  box.addEventListener('pointerup',()=>end(true));box.addEventListener('pointercancel',()=>end(false));
  box.addEventListener('lostpointercapture',()=>{if(d&&d.on)end(true)});
  box.addEventListener('click',e=>{if(Date.now()-(box._dsAt||0)<400){e.stopPropagation();e.preventDefault()}},true); // 끌고 놓은 손은 클릭으로 안 침
  box.addEventListener('contextmenu',e=>{if(e.target.closest(sel))e.preventDefault()});
  box.addEventListener('touchmove',e=>{if(d&&d.on)e.preventDefault()},{passive:false});
  box.addEventListener('dragstart',e=>e.preventDefault()); // 그림을 끌어 가는 브라우저 기본 동작 막기
}
// 보이는 캐릭터끼리 순서만 바꾸고, 숨긴 캐릭터 등 나머지는 원래 자리에
function reorderChars(ids){const pos=ids.map(id=>st.chars.findIndex(c=>c.id===id)).filter(i=>i>=0).sort((a,b)=>a-b),by=new Map(st.chars.map(c=>[c.id,c]));
  if(pos.length!==ids.length)return;ids.forEach((id,n)=>{st.chars[pos[n]]=by.get(id)})}

/* ================= 수익 기록 (통계) =================
   따로 떼어 둔 파일 — 빌드할 때 %STATS% 자리에 들어감.
   데이터: 캐릭터별 clears[보스]=[{d,diff,v}] (v=결정석 내 몫), loot['보스|기간키']=[템], lootSub['보스|기간키'][상자]=결과,
          보상 탭의 예상 판매가 cfg[보스].loot[템].price */
const SX_U={W:'주',M:'월',A:'전체'};
const sxD=s=>{const[y,m,d]=s.split('.').map(Number);return new Date(Date.UTC(y,m-1,d))};
const sxAdd=(s,n)=>ymd(new Date(sxD(s).getTime()+n*864e5));
const sxWeek=s=>{const d=sxD(s),back=(d.getUTCDay()-4+7)%7;return ymd(new Date(d.getTime()-back*864e5))}; // 목요일 시작
const sxMonth=s=>s.slice(0,7)+'.01';
const sxMonthAdd=(s,n)=>{const d=sxD(s);return ymd(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1)))};
// 예상 판매가 글자 → 메소 ("3억 5000만", "35000000", "3.5억" 모두)
function sxMeso(t){if(t==null||t==='')return null;const s=String(t).replace(/[,\s메소]/g,'');if(!s)return null;
  if(/^[\d.]+$/.test(s))return Math.round(+s);let v=0,m;
  if((m=s.match(/([\d.]+)조/)))v+=+m[1]*1e12;if((m=s.match(/([\d.]+)억/)))v+=+m[1]*1e8;if((m=s.match(/([\d.]+)만/)))v+=+m[1]*1e4;
  const rest=s.replace(/[\d.]+조/,'').replace(/[\d.]+억/,'').replace(/[\d.]+만/,'');if(/^\d+$/.test(rest))v+=+rest;return v?Math.round(v):null}
// 입력 미리보기: 1500000000 → 15억 · 1조 2345억 6789만 (조 단위까지)
