<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메푸리 테스트</title>
<meta name="description" content="메푸리 보스 관리 테스트 웹">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#F1F4F6;--top:#1F232E;--logo:#D2F53C;--banner:linear-gradient(90deg,rgba(7,15,37,.2) 28.27%,rgba(104,115,140,.2) 63.61%),linear-gradient(90deg,rgba(7,15,37,.2) 30.94%,rgba(104,115,140,.2) 64%),#2C364D;
  --card:#FFFFFF;--card-bd:rgba(0,0,0,.08);--nav-bd:rgba(0,0,0,.15);--frame:#E4E8EA;--seg:#E4E8EB;--soft:#F4F5F6;
  --border:#E4E8EB;--border2:#C8CFD5;--input-bd:#C6CFD7;--input-fg:#223548;
  --text:#1E3043;--text2:#3B546B;--sub:#6C7784;--muted:#98A0A9;--faint:#B1B9C3;--name:#363941;--price:#2F3033;--subgray:#929598;--dash:#D3D7DB;--sort:#4A5565;
  --accent:#F68600;--accent-hover:#DA7700;--accent-soft:#FFECD5;--accent-bg:#FFFBF6;--primary:#49515B;--primary-hover:#3B424A;--on-primary:#FFFFFF;
  --out-bd:#CED6DC;--dis-bg:#D6D6D6;--dis-fg:#FFFFFF;--info-bg:#F0F5FD;--info-bd:#D8E4F8;--info-fg:#3F6FCF;--teal-bg:#E9F7FB;--teal-fg:#1896B0;
  --toggle-off:#C0C8CF;--frame-bg:linear-gradient(180deg,#F8F9FA,#E6E9EC);--modal-top:#737D95;--pop-shadow:0 10px 28px rgba(20,30,50,.16);--seg-shadow:0 1.5px 0 rgba(152,162,179,.25);
  --avatar-bg:linear-gradient(160deg,#3a3d62,#4d4a7c);
  --pill-bg:rgba(0,0,0,.15);--frame-bd:transparent;--top-bd:transparent;--banner-bd:transparent;--refresh-bg:#566282;--toast-bg:#2B2F3A;
  --scroll-thumb:#CED6DC;--scroll-thumb-hover:#A9B2BC;
  --cm-head:#D5DCE3;--cm-card:#F4F6F8;--cm-on:#3E4A65;
  --danger:#E0475B;--danger-hover:#C93A4D;--danger-fg:#D63C51;--danger-bg:#FFF4F5;--danger-bd:#F2BBC3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14161B;--top:#0C0D11;--banner:linear-gradient(90deg,rgba(7,15,37,.2) 28.27%,rgba(104,115,140,.2) 63.61%),linear-gradient(90deg,rgba(7,15,37,.2) 30.94%,rgba(104,115,140,.2) 64%),#2C364D;
    --card:#1E2128;--card-bd:rgba(255,255,255,.07);--nav-bd:rgba(255,255,255,.08);--frame:#262A32;--seg:#2A2E37;--soft:#252932;
    --border:#30343D;--border2:#4A4F5B;--input-bd:#3A3F4A;--input-fg:#E3E7EC;
    --text:#ECEEF2;--text2:#C9D2DC;--sub:#A3ABB6;--muted:#7D8591;--faint:#5B606B;--name:#ECEEF2;--price:#ECEEF2;--subgray:#8E94A0;--dash:#343842;--sort:#C3C7CF;
    --accent:#FF8A33;--accent-hover:#FF9C52;--accent-soft:#3A2616;--accent-bg:#2A1F16;--primary:#E6E8EC;--primary-hover:#FFFFFF;--on-primary:#1A1C21;
    --out-bd:#3A3F4A;--dis-bg:#343944;--dis-fg:#8E94A0;--info-bg:#1B2536;--info-bd:#2A3A55;--info-fg:#8FB3F0;--teal-bg:#16323A;--teal-fg:#5FD0E6;
    --toggle-off:#4A4F5B;--frame-bg:linear-gradient(180deg,#2C313B,#22262E);--modal-top:#3A4055;--pop-shadow:0 10px 28px rgba(0,0,0,.45);--seg-shadow:0 1.5px 0 rgba(0,0,0,.35);
    --avatar-bg:linear-gradient(160deg,#25273f,#35325a);
    --scroll-thumb:#4A4F5B;--scroll-thumb-hover:#5F6572;--cm-head:#2A2F39;--cm-card:#252932;--cm-on:#4A5675;--danger:#E0475B;--danger-hover:#EA5A6D;--danger-fg:#FF7C8E;--danger-bg:#2B171B;--danger-bd:#5C2A33;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14161B;--top:#0C0D11;--banner:linear-gradient(90deg,rgba(7,15,37,.2) 28.27%,rgba(104,115,140,.2) 63.61%),linear-gradient(90deg,rgba(7,15,37,.2) 30.94%,rgba(104,115,140,.2) 64%),#2C364D;
  --card:#1E2128;--card-bd:rgba(255,255,255,.07);--nav-bd:rgba(255,255,255,.08);--frame:#262A32;--seg:#2A2E37;--soft:#252932;
  --border:#30343D;--border2:#4A4F5B;--input-bd:#3A3F4A;--input-fg:#E3E7EC;
  --text:#ECEEF2;--text2:#C9D2DC;--sub:#A3ABB6;--muted:#7D8591;--faint:#5B606B;--name:#ECEEF2;--price:#ECEEF2;--subgray:#8E94A0;--dash:#343842;--sort:#C3C7CF;
  --accent:#FF8A33;--accent-hover:#FF9C52;--accent-soft:#3A2616;--accent-bg:#2A1F16;--primary:#E6E8EC;--primary-hover:#FFFFFF;--on-primary:#1A1C21;
  --out-bd:#3A3F4A;--dis-bg:#343944;--dis-fg:#8E94A0;--info-bg:#1B2536;--info-bd:#2A3A55;--info-fg:#8FB3F0;--teal-bg:#16323A;--teal-fg:#5FD0E6;
  --toggle-off:#4A4F5B;--frame-bg:linear-gradient(180deg,#2C313B,#22262E);--modal-top:#3A4055;--pop-shadow:0 10px 28px rgba(0,0,0,.45);--seg-shadow:0 1.5px 0 rgba(0,0,0,.35);
  --avatar-bg:linear-gradient(160deg,#25273f,#35325a);
  --scroll-thumb:#4A4F5B;--scroll-thumb-hover:#5F6572;--cm-head:#2A2F39;--cm-card:#252932;--cm-on:#4A5675;--danger:#E0475B;--danger-hover:#EA5A6D;--danger-fg:#FF7C8E;--danger-bg:#2B171B;--danger-bd:#5C2A33;
}
:root[data-mode="deep"]{
  color-scheme:dark;
  --bg:#000000;--top:#000000;--banner:#000000;
  --card:#000000;--card-bd:#2F3336;--nav-bd:#2F3336;--frame:#000000;--seg:#16181C;--soft:#16181C;
  --border:#2F3336;--border2:#3E4144;--input-bd:#2F3336;--input-fg:#E7E9EA;
  --text:#E7E9EA;--text2:#D6D9DB;--sub:#A5AAAF;--muted:#71767B;--faint:#4A4E52;--name:#E7E9EA;--price:#E7E9EA;--subgray:#8B9094;--dash:#2F3336;--sort:#A5AAAF;
  --accent:#FF8A33;--accent-hover:#FF9C52;--accent-soft:#2A1606;--accent-bg:#140A02;--primary:#E7E9EA;--primary-hover:#FFFFFF;--on-primary:#000000;
  --out-bd:#2F3336;--dis-bg:#16181C;--dis-fg:#71767B;--info-bg:#000000;--info-bd:#1D3B5C;--info-fg:#8FB3F0;--teal-bg:#04161A;--teal-fg:#5FD0E6;
  --toggle-off:#3E4144;--frame-bg:linear-gradient(180deg,#16181C,#0A0B0D);--modal-top:#16181C;--pop-shadow:0 0 0 1px #2F3336,0 12px 32px rgba(0,0,0,.9);--seg-shadow:none;
  --avatar-bg:#16181C;--pill-bg:#16181C;--frame-bd:#2F3336;--top-bd:#2F3336;--banner-bd:#2F3336;--accent-line:#FF8A33;--refresh-bg:#16181C;--toast-bg:#16181C;--scroll-thumb:#2F3336;--scroll-thumb-hover:#4A4E52;--cm-head:#16181C;--cm-card:#0A0B0D;--cm-on:#2A3350;--danger:#E0475B;--danger-hover:#EA5A6D;--danger-fg:#FF6B7F;--danger-bg:#000000;--danger-bd:#5C2A33;
}
*{box-sizing:border-box}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:999px;border:1px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover);border:1px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) transparent}}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
input,select{font-family:inherit;font-size:13px;color:var(--input-fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}
.eok{font-size:1.1em;font-weight:800;letter-spacing:-.01em}
.pret{font-family:"Pretendard","Noto Sans KR",sans-serif}

/* top bar */
.top{background:var(--top);border-bottom:1px solid var(--top-bd)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:40px}
.logo{font-size:16px;font-weight:800;letter-spacing:.02em;color:var(--logo)}
.top-r{display:flex;align-items:center;gap:12px;min-width:0}
.timers{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:#98A0A9;white-space:nowrap}
.timers b{color:#F1851C;font-weight:500}
.vbar{flex-shrink:0;width:1px;height:14px;background:#49515B}
.top-link{font-size:12px;font-weight:700;color:#B1B9C3}
.theme-btn{display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#B1B9C3;font-size:12px;font-weight:700}
.theme-btn:hover{color:#fff}

/* banner */
.banner{position:relative;overflow:hidden;background:var(--banner);border-bottom:1px solid var(--banner-bd)}
.banner>.bn-glow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.banner>.wrap{position:relative}
.b-ava .ch-glow{position:absolute;left:-20px;bottom:0;pointer-events:none;overflow:visible}
.banner>.bn-glow{overflow:visible}
:root[data-mode="deep"] .bn-glow,:root[data-mode="deep"] .ch-glow{display:none}
.banner .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:80px;flex-wrap:wrap}
.b-left{display:flex;align-items:center;min-width:0}
.b-ava{position:relative;width:110px;height:80px;flex-shrink:0}
.b-ava img{position:absolute;left:22px;bottom:0;width:56px;height:76px;object-fit:contain;object-position:bottom;image-rendering:pixelated}
.b-ava .sil{position:absolute;left:28px;bottom:4px}
.b-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.b-name{display:flex;align-items:center;gap:4px;color:#fff;font-size:16px;font-weight:700;line-height:18px}
.world{padding:0 5px;border-radius:3px;background:rgba(255,255,255,.14);font-size:10px;font-weight:700;line-height:16px}
.b-meta{display:flex;align-items:center;gap:6px;font-size:13px;color:#ADADAD;flex-wrap:wrap}
.b-meta i{width:1px;height:12px;background:rgba(255,255,255,.2)}
.b-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px}
.pill{display:flex;align-items:center;gap:8px;min-width:210px;min-height:28px;padding:0 10px;border-radius:999px;background:var(--pill-bg)}
.pill .v{font-size:14px;font-weight:700;color:#e0e6ed;white-space:nowrap}
.pill .l{margin-left:auto;font-size:11px;color:#9EA3C0;white-space:nowrap}
.coin{position:relative;flex-shrink:0;display:inline-block;border-radius:50%;background:linear-gradient(135deg,#FFE563 50%,#F7CC4A 50%)}
.coin::after{content:'';position:absolute;left:18.75%;top:18.75%;width:62.5%;height:62.5%;border-radius:50%;background:linear-gradient(135deg,#EDB911 50%,#EAAD11 50%)}
.coin.off{background:var(--seg);box-shadow:none}.coin.off::after{background:var(--soft);box-shadow:none}
.b-letter{position:relative;flex-shrink:0;display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#99A1BC 50%,#7C8298 50%)}
.b-letter::before{content:'';position:absolute;inset:1px;border-radius:50%;background:linear-gradient(135deg,#7D849F 50%,#666B83 50%)}
.b-letter b{position:relative;top:.5px;font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:10px;font-weight:800;line-height:1;color:#F5F2FA;text-shadow:.6px .6px 0 #4A4D60;-webkit-font-smoothing:antialiased}
.refresh{display:grid;place-items:center;width:24px;height:24px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:var(--refresh-bg);color:#fff}
.refresh:hover{background:#65719a}
.name-btn{display:flex;align-items:center;gap:4px;color:#fff}
.menu{position:absolute;z-index:40;min-width:200px;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--card);box-shadow:var(--pop-shadow)}
.menu button{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 8px;border-radius:6px;font-size:13px;color:var(--name);text-align:left}
.menu button:hover{background:var(--soft)}
.menu .sep{height:1px;margin:4px 2px;background:var(--border)}

/* nav tabs */
.tabs{background:var(--card);border-bottom:1px solid var(--nav-bd)}
.tabs .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tab-row{display:flex;overflow-x:auto;scrollbar-width:none}
.tab{position:relative;display:flex;align-items:center;gap:6px;min-width:64px;height:44px;padding:0 16px;font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--sub)}
.tab.on{color:var(--accent)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.soon{padding:0 5px;border-radius:4px;background:var(--soft);color:var(--muted);font-size:10px;font-weight:700;line-height:16px}
.nav-r{display:flex;gap:6px}
.nav-link{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:4px;font-size:12px;font-weight:500;color:var(--sub);white-space:nowrap}
.nav-link:hover{background:var(--soft)}

/* layout */
.page{display:flex;gap:32px;align-items:flex-start;padding-block:16px 40px}
.col-l{width:380px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.col-l>.note,.col-l>.foot{flex-shrink:0}
.col-r{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.col-r>.bar,.datebar{flex-shrink:0}.datebar{container:dbar/inline-size}
@container dbar (max-width:380px){.datebar.datebar>button{padding:0 5px}.datebar.datebar .dnow{min-width:0;padding-inline:4px}.datebar.datebar .dnow small{margin-left:0}}
.datebar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-height:44px;padding:5px 8px;border-radius:10px;border:1px solid var(--card-bd);background:var(--card)}
.datebar button{display:flex;align-items:center;justify-content:center;gap:3px;height:32px;line-height:1;padding:0 9px;border-radius:6px;font-size:14px;font-weight:700;color:var(--sub)}
.datebar button span{font-size:12px;font-weight:500}
.datebar button:hover:not(:disabled){background:var(--soft);color:var(--text)}
.datebar button:disabled,.datebar button.dim{opacity:.35}
.datebar button.dim:hover{background:none!important;color:var(--sub)!important}
.dwrap{position:relative;display:flex;align-items:center}
.datebar .dnow{display:flex;align-items:center;gap:4px;min-width:112px;justify-content:center;padding:0 8px;font-size:14px;font-weight:400;color:var(--text2)}
.dnow svg{align-self:center;margin-left:2px}
.cal{position:absolute;top:calc(100% + 6px);left:50%;z-index:20;transform:translateX(-50%);width:304px;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:var(--pop-shadow)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:15px;color:var(--text)}
.cal-h button{width:30px;height:30px;border-radius:6px;font-size:18px;color:var(--sub)}.cal-h button:hover:not(:disabled){background:var(--soft)}.cal-h button:disabled{opacity:.3}
.cal-g{display:grid;grid-template-columns:30px repeat(7,1fr);gap:2px}
.cal-g .wn{display:grid;place-items:center;height:32px;font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}.cal-g .wn.om{display:flex;flex-direction:column;justify-content:center;gap:0;line-height:12px}.cal-g .wn small{font-size:9.5px;font-weight:500}.cal-g button.om{opacity:.45}.cal-g button.om.dim{opacity:.3}.cal-f .wkf{margin-left:auto}.cal-g .wn.on{color:var(--accent)}
.cal-g em{font-style:normal;text-align:center;font-size:11px;color:var(--muted);padding:2px 0 4px}.cal-g em.sun{color:#E0475B}.cal-g em.sat{color:#3F6FCF}
.cal-g button{position:relative;height:32px;border-radius:6px;font-size:13px;color:var(--text2)}
.cal-g button:hover:not(:disabled){background:var(--soft)}
.cal-g button:disabled{color:var(--faint);opacity:.5}
.cal-g button.wk{background:var(--accent-bg)}
.cal-g button.real{font-weight:800;box-shadow:inset 0 0 0 1px var(--border2)}
.cal-g button.on{background:var(--accent);color:#fff;font-weight:700}
.datebar .cal-g button{display:block;padding:0;height:32px;font-size:13px;font-weight:500;color:var(--text2)}
.datebar .cal-g button.on{color:#fff;font-weight:700}.datebar .cal-g button.real{font-weight:800}
.datebar .cal-g button.dim{color:var(--faint);opacity:.5}
.datebar .cal-h button{display:grid;place-items:center;padding:0;width:30px;height:30px;font-size:18px}
.cal-g button i{position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:#4AA5D6}
.cal-g button.on i{background:#fff}
.cal-f{display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--muted)}
.cal-f span{display:flex;align-items:center;gap:4px}.cal-f i{width:5px;height:5px;border-radius:3px;background:#4AA5D6}.cal-f s{width:12px;height:10px;border-radius:2px;background:var(--accent-bg);border:1px solid var(--accent-soft)}
.dnow b{font-size:15px;color:var(--text)}.dnow small{margin-left:2px;font-size:11px;color:var(--muted)}
.datebar.past{border-color:var(--accent);background:var(--accent-bg)}
.datebar .dnow b,.datebar .dnow small{line-height:1}
.datebar.past .dnow b,.datebar.past .dnow small{color:var(--accent)}
.datebar{justify-content:space-between}
.sp .fbtns{flex-wrap:wrap}
.sp .sx-mseg{flex:1}
.dpast{display:flex;align-items:center;gap:8px;width:100%;padding:4px 4px 2px;border-top:1px dashed var(--accent-soft)}
.dhint{flex:1;font-size:12px;line-height:18px;color:var(--accent)}.dhint b{font-size:13px}.dhint .num{opacity:.85}
.datebar .dtoday{background:var(--accent);color:#fff}.datebar .dtoday:hover{background:var(--accent-hover)!important;color:#fff!important}
.rscroll{display:flex;flex-direction:column;gap:8px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;font-size:12px;color:var(--muted)}
.linkish{font-size:12px;color:var(--sub);text-decoration:underline;text-underline-offset:2px}

/* char list */
.clist{display:flex;flex-direction:column;flex:0 1 auto;min-height:0;padding:4px 16px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card)}
.crow{display:flex;align-items:center;gap:10px;width:100%;height:56px;border-bottom:1px solid var(--border);text-align:left}
.crow .nm{font-size:14px;font-weight:700;line-height:20px;color:var(--text)}
.crow.on .nm{color:var(--accent)}
.crow .sb{font-size:12px;color:var(--muted)}
.cnt{min-width:44px;height:22px;padding:0 9px;border-radius:999px;background:var(--soft);color:var(--sub);text-align:center;font-size:12px;font-weight:500;line-height:22px}
.crow.on .cnt{background:var(--accent-soft);color:var(--accent)}
.ava{flex-shrink:0;width:34px;height:34px;border-radius:50%;object-fit:contain;background:var(--soft);image-rendering:pixelated}
.sil-ava{flex-shrink:0;display:grid;place-items:end center;width:34px;height:34px;border-radius:50%;background:var(--soft);overflow:hidden}
.add-row{display:flex;align-items:center;gap:10px;height:52px;font-size:13px;font-weight:500;color:var(--sub)}
.add-row:hover{color:var(--accent)}
.dash-c{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px dashed var(--border2)}
.note{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:9px;background:var(--frame);border:1px solid var(--frame-bd)}
.note h3{display:flex;align-items:center;gap:5px;margin:0;font-size:13px;font-weight:500;color:var(--sub)}
.note p{margin:0;font-size:12px;line-height:18px;color:var(--muted)}
.note p b{color:var(--text2)}
.note p b.acc{color:var(--accent)}
.note small{font-size:11px;color:var(--faint)}

/* filters */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;flex-wrap:wrap}
.dots{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dot{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:500;color:var(--muted)}
.dot::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--faint)}
.dot.on{font-weight:700;color:var(--text)}
.dot.on::before{background:var(--accent)}
.bar-r{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--sort)}
.tg{position:relative;display:inline-block;vertical-align:middle;flex-shrink:0;width:32px;height:16px;border-radius:8px;background:var(--toggle-off);transition:background .15s}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:6px;background:#fff;transition:transform .15s}
.tg.on{background:var(--accent)}
.tg.on::after{transform:translateX(16px)}
.tg-lbl{display:flex;align-items:center;gap:8px}
/* 보기 옵션 (옥션 정렬 메뉴 모양) */
.vo-w{position:relative}
.vo-btn{display:flex;align-items:center;gap:6px;height:30px;padding:0 4px;font-size:13px;font-weight:500;color:var(--sort)}
.vo-dot{width:6px;height:6px;border-radius:3px;background:var(--accent)}
.vo-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:25;display:flex;flex-direction:column;gap:2px;min-width:190px;padding:6px;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:var(--pop-shadow)}
.vo-menu button{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 12px;border-radius:6px;font-size:14px;color:var(--text);text-align:left;white-space:nowrap}
.vo-menu button:hover,.vo-menu button.on{background:var(--soft)}
.vo-menu button.on{font-weight:700}
.vo-menu .sep{height:1px;margin:4px 6px;background:var(--border)}
.vo-menu .vo-reset{color:var(--sub);font-size:13px}
.sec{display:flex;align-items:center;gap:6px;min-height:32px;margin-top:12px;font-size:14px;font-weight:700;color:var(--text)}
.sec .c{font-size:13px;font-weight:500;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;border-radius:12px;border:1px dashed var(--border2);color:var(--muted);text-align:center}
.empty b{color:var(--text2);font-size:14px}

/* flags + badges */
.flag{position:absolute;top:-9px;left:-1px;width:20px;height:22px;padding-top:3px;text-align:center;clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);border-radius:4px 4px 0 0;color:#fff;font-size:12px;font-weight:900;line-height:13px;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.flag.sm{top:-6px;width:15px;height:17px;padding-top:2px;font-size:9px;line-height:10px;border-radius:3px 3px 0 0}
.mini{display:inline-block;flex-shrink:0;width:14px;height:16px;padding-top:2px;text-align:center;clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);border-radius:3px 3px 0 0;color:#fff;font-size:9px;font-weight:900;line-height:10px}
.fD{background:linear-gradient(135deg,#9BDCF5,#4AA5D6)}.fW{background:linear-gradient(135deg,#CADB69,#ABC03D)}.fM{background:linear-gradient(135deg,#B79CFF,#7C4DEB)}
.bD{border-color:#3E93C4!important}.bW{border-color:#83AD20!important}.bM{border-color:#7C4DEB!important}
.dk{display:inline-flex;align-items:center;height:16px;padding:0 7px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
.dk-easy{background:linear-gradient(180deg,#9ba4ac,#8a969f);color:#eef0f2}
.dk-normal{background:linear-gradient(180deg,#4fb1cc,#319dbc);color:#fff}
.dk-hard{background:linear-gradient(180deg,#dd5f86,#bf3d66);color:#fff}
.dk-chaos{background:#494949;color:#f3d3b4;box-shadow:inset 0 0 0 1.2px #d7bd9a}
.dk-extreme{background:#494949;color:#f26a45;box-shadow:inset 0 0 0 1.2px #e65575}

/* boss cards */
.bcard{position:relative;display:flex;align-items:center;gap:16px;box-sizing:border-box;height:84px;padding:12px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card);transition:border-color .15s}
.bcard:hover{border-color:var(--accent)}
.bcard.done .fr img{opacity:.5}
/* 보스 현황: 흰 판 하나 안에 줄로 (보스 설정 표와 같은 틀) */
.bc-list{display:flex;flex-direction:column;padding:4px 16px 8px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card)}
.bc-list>.sec{margin-top:8px;min-height:40px;border-bottom:1px solid var(--border)}
.bc-list>.sec:first-child{margin-top:0}
.bc-list>.empty{margin:10px 0;border:0}
.bcard.brw{height:auto;min-height:60px;padding:8px 6px;gap:12px;border:0;border-radius:8px;background:none;border-bottom:1px dashed var(--border)}
.bcard.brw:hover{border-color:var(--border);background:var(--soft)}
.bcard.brw.sweep{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.brw .bmid{flex:1;height:auto;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;text-align:left}.brw .brow{justify-content:flex-start;max-width:100%}.brw .bline{max-width:100%}
.brw .bline{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden}
.brw .bline .bprice{height:auto;flex-shrink:0}
.brw .bline .wkrow,.brw .bline .bsub{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.brw .wkc{font-size:11.5px;color:var(--muted)}
.brw .bright{height:auto;flex-direction:row;align-items:center}
.brw .acts{align-items:center}
.brw .btn{height:32px;min-width:100px;padding:0 12px;font-size:13px}
.brw .ibtn{width:32px;height:32px}
.bc-list [data-clear]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bc-list [data-clear]{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.bcard.brw.hold [data-clear]{transform:scale(.94);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.bcard.brw.sweep [data-clear]{transform:scale(1.03)}
.brw.done .bname{opacity:.6}
.panel.sp{flex:0 1 auto}.sp .fbody{padding:4px 12px}
.sp .clist{padding:0;border:0;border-radius:0;background:none}.sp .crow:last-of-type{border-bottom:1px solid var(--border)}
.fr{position:relative;display:grid;place-items:center;flex-shrink:0;width:64px;height:64px;border-radius:6px;border:1px solid var(--border);background:var(--frame-bg)}
.fr img{width:52px;height:52px;border-radius:3px;object-fit:cover}
.fr.s40{width:40px;height:40px}.fr.s40 img{width:32px;height:32px;border-radius:2px}
.fr .pmz{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;width:32px;height:32px;border-radius:2px;overflow:hidden}
.fr .pmz img{width:100%;height:100%;border-radius:0;object-fit:cover}.fr .pmz i{background:var(--soft)}
.prow>.fr{flex-shrink:0}
.bmid{flex:1;min-width:0;height:64px;display:grid;grid-template-rows:20px 19px 19px;row-gap:2px;align-content:center;align-items:center}
.bmid>.brow{grid-row:1}.bmid>.bprice{grid-row:3}.bmid>:not(.brow):not(.bprice){grid-row:2;min-width:0;overflow:hidden}
.brow{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.brow .bname{overflow:hidden;text-overflow:ellipsis}.brow>*{flex-shrink:0}.brow>.bname,.brow>.was{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bname{font-size:14px;font-weight:500;line-height:20px;color:var(--name)}
.bsub{font-size:13px;line-height:18px;color:var(--subgray)}
.tmp{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:4px;border:1px solid var(--info-bd);background:var(--info-bg);color:var(--info-fg);font-size:10px;font-weight:700;white-space:nowrap}
.was{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap}
.was .dk{height:14px;padding:0 5px;font-size:9px;opacity:.75}
.c-tag{display:flex;align-items:center;gap:4px;margin-top:2px}
.ftop{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;padding:0 4px 10px}
.ckl{display:inline-flex;align-items:center;gap:8px;min-height:20px;font-size:13px;font-weight:500;color:var(--sub)}
.ckl[aria-checked="true"]{color:var(--text)}
.ckl:disabled{cursor:not-allowed;opacity:.8}
.ftop-s{font-size:11px;color:var(--faint);text-align:right}
.pspan{width:100%;padding-bottom:4px}
.seg.seg-in{flex:0 0 auto;margin-left:auto}.seg.seg-in button{flex:0 0 auto;padding:0 14px;font-size:12.5px}.seg.seg-in button.once{color:var(--info-fg)}
.span2 button[data-fspan="once"].on,.span2 button[data-pspan="once"].on{color:var(--info-fg)}
.ckl[aria-checked="true"]+.ftop-s{color:var(--info-fg)}
.span2{display:inline-flex;gap:2px;height:26px;padding:2px;border-radius:6px;background:var(--seg)}
.span2 button{padding:0 10px;border-radius:4px;font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap}
.span2 button.on{background:var(--card);box-shadow:var(--seg-shadow);color:var(--text)}
.span2 button[data-span="once"].on,.span2 button[data-cspan="once"].on{color:var(--info-fg)}.cp-span button{padding:0 8px}
.cp-span button[data-cspan="back"].on,.cp-span button[data-cspan="hist"].on{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent-soft);color:var(--accent)}
.tmp.from{border-color:var(--accent-soft);background:var(--accent-bg);color:var(--accent)}
.pop.cfgp{width:320px;gap:12px;padding:14px 14px 12px}
.rm-arm{height:24px;padding:0 9px;border-radius:6px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;animation:rmin .15s ease-out}.rm-arm:hover{background:var(--danger-hover)}
@keyframes rmin{from{transform:scale(.85);opacity:.4}}
.c-act.arming .mini-btn{display:none}
.cp-hd{display:flex;align-items:flex-start;gap:8px}.cp-tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cp-now{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}.cp-now img{width:20px;height:20px;border-radius:4px;object-fit:cover}.cp-now i,.cp-chg i{font-style:normal;font-size:11px;color:var(--muted)}
.cp-x{display:grid;place-items:center;width:24px;height:24px;margin:-4px -4px 0 0;border-radius:6px;color:var(--muted)}.cp-x:hover{background:var(--soft);color:var(--text)}
.cp-grid{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px 10px;padding-top:10px;border-top:1px solid var(--border)}
.cp-l{font-size:12px;font-weight:500;color:var(--muted)}
.cfgp .sel{height:30px}
.cp-seg{height:30px;padding:3px;gap:2px}.cp-seg button{font-size:12px;font-weight:700}
.cp-step{display:flex;align-items:center;height:30px;border-radius:6px;border:1px solid var(--input-bd);overflow:hidden}
.cp-step button{display:grid;place-items:center;width:30px;height:100%;color:var(--sub)}.cp-step button:hover:not(:disabled){background:var(--soft)}.cp-step button:disabled{opacity:.35}
.cp-step span{flex:1;text-align:center;font-size:12px;color:var(--sub)}.cp-step b{margin-right:1px;font-size:13px;color:var(--text)}
.fstep{flex:1;height:28px}.fstep button{width:32px}
.cp-span{display:flex;height:30px}.cp-span button{flex:1}
.cp-span button.on{box-shadow:inset 0 0 0 1px var(--border2)}.cp-span button[data-cspan="once"].on{background:var(--info-bg);box-shadow:inset 0 0 0 1px var(--info-bd)}.cp-span button[data-cspan="keep"].on{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent-soft);color:var(--accent)}
.cp-prev{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:8px;background:var(--soft)}
.cp-prev.none{align-items:center;padding:9px}.cp-pl{font-size:12px;color:var(--faint)}
.cp-chg{display:flex;align-items:center;flex-wrap:wrap;gap:5px}.cp-chg img{width:18px;height:18px;border-radius:4px;object-fit:cover}.cp-chg em{margin:0 2px;font-style:normal;font-weight:700;color:var(--accent)}
.cp-h{font-size:11px;line-height:16px;color:var(--muted)}
.cp-empty{padding:0 6px;border-radius:4px;border:1px dashed var(--border2);font-size:11px;line-height:16px;color:var(--muted)}.cp-bn{font-size:12px;font-weight:700;color:var(--text)}
.fbody>.cp-prev{margin:10px 4px 0}
.cp-btns{display:flex;gap:6px}.cp-btns .btn{flex:1;height:32px;font-weight:700}
.once-note{display:flex;align-items:flex-start;gap:6px;margin:8px 4px 0;padding:8px 10px;border-radius:6px;border:1px solid var(--info-bd);background:var(--info-bg);color:var(--info-fg);font-size:12px;line-height:18px}
.once-note svg{flex-shrink:0;margin-top:2px}
.wkrow{display:flex;align-items:center;gap:6px;min-height:18px;white-space:nowrap}
.wk{display:inline-flex;gap:2px}
.wk i{display:grid;place-items:center;width:17px;height:16px;border-radius:3px;background:var(--soft);color:var(--faint);font-size:10px;font-style:normal;font-weight:700;line-height:1}
.wk i.on{background:linear-gradient(135deg,#9BDCF5,#4AA5D6);color:#fff}
.wk i.now{box-shadow:inset 0 0 0 1px #4AA5D6}
.wk i.now:not(.on){color:#4AA5D6}
.wk i.fut{opacity:.5}
.wkc{font-size:12px;color:var(--subgray)}.wkc b{font-weight:700;color:var(--text2)}
.bprice{display:flex;align-items:baseline;gap:4px;height:19px;font-size:13px;line-height:19px}
.bprice .coin{align-self:center;margin-right:1px}
.bprice b{font-weight:700;color:var(--price)}
.bprice>span:not(.coin){margin-left:2px;font-size:11.5px;font-weight:400;color:var(--price);opacity:.85}
.bprice .na{color:var(--muted)}
.bprice b .eok{font-size:14.5px;color:inherit}
.bright{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px;height:64px;flex-shrink:0}
.chip{display:flex;align-items:center;justify-content:center;min-width:80px;height:20px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500}
.chip.todo{background:var(--accent-bg);color:var(--accent)}
.chip.ok{background:var(--teal-bg);color:var(--teal-fg)}
.acts{position:relative;display:flex;gap:6px}
.ibtn{position:relative;display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid var(--out-bd);background:var(--card);color:var(--sub)}
.ibtn:hover:not(:disabled){background:var(--soft)}
.ibtn:disabled{color:var(--faint)}
.ibtn.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ibtn.on{border-color:var(--accent);color:var(--accent)}
.badge{position:absolute;top:-5px;right:-5px;display:grid;place-items:center;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--accent);color:#fff;font-size:9px;font-weight:800;box-shadow:0 0 0 2px var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:80px;height:28px;padding:0 16px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover:not(:disabled){background:var(--accent-hover)}
.btn.dis,.btn:disabled{background:var(--dis-bg);color:var(--dis-fg)}
.btn.out{border:1px solid var(--out-bd);background:var(--card);color:var(--sub)}.btn.out:hover{background:var(--soft)}
.btn.dark{background:var(--primary);color:var(--on-primary)}.btn.dark:hover:not(:disabled){background:var(--primary-hover)}
.btn.dark:disabled{opacity:.4;background:var(--primary);color:var(--on-primary)}
.btn.lg{height:32px}
.btn.danger{background:var(--danger);color:#fff}.btn.danger:hover:not(:disabled){background:var(--danger-hover)}.btn.danger:disabled{opacity:.35;cursor:not-allowed}
/* 클리어 완료 → 마우스를 올리면(터치는 한 번 탭하면) 클리어 취소 */
.btn.done{background:var(--dis-bg);color:var(--dis-fg)}
.btn.done .u,.btn.done.arm .d,.btn.done:focus-visible .d{display:none}
.btn.done.arm .u,.btn.done:focus-visible .u{display:inline}
.btn.done.arm,.btn.done:focus-visible{background:var(--danger-bg);color:var(--danger-fg);box-shadow:inset 0 0 0 1px var(--danger-bd)}
@media (hover:hover){
  .btn.done:hover .d{display:none}.btn.done:hover .u{display:inline}
  .btn.done:hover{background:var(--danger-bg);color:var(--danger-fg);box-shadow:inset 0 0 0 1px var(--danger-bd)}
}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchips .gem{width:18px;height:18px;font-style:normal}.lchips .gem img{width:16px;height:16px}
.lchips span{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 4px;border-radius:6px;background:var(--card);border:1px solid var(--border);font-size:12px;font-weight:500;color:var(--name)}

/* loot popover */
.pop{position:absolute;top:36px;right:0;z-index:30;display:flex;flex-direction:column;gap:8px;width:300px;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:var(--pop-shadow)}
.pop.up{top:auto;bottom:36px}
.pop h4{margin:0;font-size:13px;color:var(--text)}
.pop .s{font-size:12px;color:var(--muted)}
.opt{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:4px 8px;border-radius:6px;text-align:left;font-size:13px;font-weight:500;color:var(--name)}
.opt:hover{background:var(--soft)}
.opt.on{background:var(--accent-bg)}
.cb{flex-shrink:0;display:grid;place-items:center;width:16px;height:16px;border-radius:4px;border:1px solid var(--border2);background:var(--card)}
.on>.cb,.cb.on{border-color:var(--accent);background:var(--accent)}
.gem{flex-shrink:0;display:grid;place-items:center;width:22px;height:22px;border-radius:4px;background:var(--soft);color:var(--muted)}
.gem img{width:82%;height:82%;object-fit:contain}
.opts{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto}
.bxg{margin:2px 0;border-radius:8px;background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent-soft)}
.bxg.none{box-shadow:inset 0 0 0 1px var(--accent)}
.bxg .opt.on{background:transparent}
.bxr{display:flex;flex-direction:column;gap:6px;padding:0 8px 8px}
.bxl{display:flex;align-items:center;gap:4px;padding-top:6px;border-top:1px dashed var(--accent-soft);font-size:11px;font-weight:700;color:var(--sub)}.bxl svg{flex-shrink:0;color:var(--faint)}
.bxg.none .bxl{color:var(--accent)}.bxg.none .bxl svg{color:var(--accent)}
.bxo{display:flex;flex-wrap:wrap;gap:4px}
.bxo button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:44px;height:42px;padding:3px 2px 2px;border-radius:6px;border:1px solid var(--border2);background:var(--card);font-size:11px;font-weight:500;line-height:13px;color:var(--text2);white-space:nowrap}
.bxo button .bi{display:grid;place-items:center;width:20px;height:20px}
.bxo button .bi img{max-width:20px;max-height:20px;object-fit:contain}
.bxo button:hover{border-color:var(--accent)}
.bxo button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.bxo button.trash .bi{color:var(--muted)}
.bxo button.trash.on{border-color:var(--sub);background:var(--soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--sub)}.bxo button.trash.on .bi{color:var(--text)}
.bxw{font-size:11px;line-height:15px;color:var(--muted)}
.inp{width:100%;height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--input-bd);background:var(--card);font-size:13px}
.inp::placeholder{color:var(--faint)}
.inp:focus{outline:none;border-color:var(--accent)}
.pop .row2{display:flex;gap:6px}
.pop .row2 .btn{flex:1;min-width:0}
.hist{display:flex;flex-wrap:wrap;gap:4px}
.hist-lbl{font-size:11px;font-weight:700;color:var(--sub)}
.hist button{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 4px 0 8px;border-radius:4px;background:var(--accent-bg);border:1px solid var(--accent-soft);color:var(--text2);font-size:11px}
.hist button:hover{border-color:var(--accent)}
.hist button i{display:grid;place-items:center;width:16px;height:16px;border-radius:3px;color:var(--muted);font-style:normal}
.hist button:hover i{color:var(--accent)}

/* settings panel */
.panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:9px;background:var(--frame);border:1px solid var(--frame-bd)}
.search{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border2);background:var(--card);color:var(--sub)}
.search input{flex:1;min-width:0;height:34px;border:0;background:transparent;font-size:14px}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none}
.inner{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border-radius:8px;background:var(--card);border:1px solid var(--frame-bd);overflow:visible}
.ftabs{display:flex;align-items:flex-end;background:var(--frame);border-radius:8px 8px 0 0}
.ftab{flex:1;display:grid;place-items:center;height:40px;border-radius:8px 8px 0 0;font-size:14px;font-weight:700;color:var(--muted)}
.ftab.on{background:var(--card);color:var(--text2);box-shadow:inset 0 2px 0 var(--accent-line,transparent)}
.fbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:12px;border-radius:0 0 8px 8px}
.seg{display:flex;gap:2px;height:36px;padding:4px;border-radius:999px;background:var(--seg)}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);box-shadow:var(--seg-shadow);color:var(--text2)}
.seg button:disabled{opacity:.4}
.seg button.sd-easy{background:linear-gradient(180deg,#9ba4ac,#8a969f);color:#fff;box-shadow:var(--seg-shadow)}
.seg button.sd-normal{background:linear-gradient(180deg,#4fb1cc,#319dbc);color:#fff;box-shadow:var(--seg-shadow)}
.seg button.sd-hard{background:linear-gradient(180deg,#dd5f86,#bf3d66);color:#fff;box-shadow:var(--seg-shadow)}
.seg button.sd-chaos{background:#494949;color:#f3d3b4;box-shadow:inset 0 0 0 1.5px #d7bd9a}
.seg button.sd-extreme{background:#494949;color:#f26a45;box-shadow:inset 0 0 0 1.5px #e65575}
.fsec{display:flex;flex-direction:column;gap:10px;padding:12px 4px;border-bottom:1px dashed var(--dash)}
.fsec:last-child{border-bottom:0}
.frow{display:flex;align-items:center;gap:6px;min-height:28px}
.flbl{width:96px;flex-shrink:0;font-size:13px;font-weight:500;color:var(--sub)}
.fblock{display:flex;flex-direction:column;gap:8px}
.fhead{display:flex;align-items:center;justify-content:space-between;min-height:20px;font-size:13px;font-weight:500;color:var(--sub)}
.sel{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 6px;border-radius:4px;border:1px solid var(--input-bd);background:var(--card);font-size:13px;font-weight:500;color:var(--input-fg)}
.sel select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.sel img{width:18px;height:18px;border-radius:3px;object-fit:cover}
.sel .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel.open,.sel:focus-within{border-color:var(--accent)}
.stack{display:flex}
.stack img,.stack .sil-ava{width:20px;height:20px;box-shadow:0 0 0 1.5px var(--card)}
.stack>*+*{margin-left:-6px}
.step{display:flex;flex:1;gap:6px}
.step .v{flex:1;display:flex;align-items:center;height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--input-bd);font-size:13px}
.step .v span{margin-left:auto;font-size:12px;color:var(--muted)}
.sq{display:grid;place-items:center;width:28px;height:28px;flex-shrink:0;border-radius:4px;border:1px solid var(--input-bd);background:var(--card);color:var(--sub)}
.sq:disabled{color:var(--faint)}
.pct{position:relative;width:76px;flex-shrink:0}
.pct input{width:100%;height:28px;padding:0 22px 0 10px;border-radius:4px;border:1px solid var(--input-bd);background:var(--card)}
.pct input:disabled{background:var(--soft);color:var(--muted)}
.pct span{position:absolute;right:8px;top:6px;font-size:12px;color:var(--muted)}
.warn{display:flex;align-items:center;gap:6px;margin:4px 4px 0;padding:8px 10px;border-radius:6px;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:500}
.fbtns{flex-shrink:0;display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.fbtns .btn{flex:1}
.dd{position:absolute;left:0;right:0;top:32px;z-index:35;display:flex;flex-direction:column;border-radius:8px;border:1px solid var(--border);background:var(--card);box-shadow:var(--pop-shadow);overflow:hidden}
.dd .opts{max-height:260px;padding:4px 6px;overscroll-behavior:contain}
.dd-head{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 14px;border-bottom:1px solid var(--border)}
.dd-foot{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border)}
.dd-foot .btn{flex:1;min-width:0;padding:0 8px;font-size:12px}
.prow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 6px;border-radius:6px;text-align:left}
.prow:hover{background:var(--soft)}
.prow.on{background:var(--accent-bg)}
.prow .t{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--text)}
.prow .d{font-size:12px;color:var(--muted)}

/* slot table */
.stable{container:slots/inline-size;display:flex;flex-direction:column;min-height:0;padding:4px 16px 8px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card)}
.sthead,.strow{display:flex;align-items:center;gap:12px}
.sthead{flex-shrink:0}
.stbody{display:flex;flex-direction:column}
.stbody>*{flex-shrink:0}
.grip{display:grid;place-items:center;width:18px;height:32px;margin:0 -3px;border-radius:4px;cursor:grab;touch-action:none}
.grip:hover{background:var(--soft)}.grip:hover svg{fill:var(--sub)}
.strow{transition:transform .15s}
.strow.dragging{position:relative;z-index:3;transition:none;background:var(--card);box-shadow:0 6px 18px rgba(0,0,0,.18);border-radius:6px;cursor:grabbing}
.bico{width:22px;height:22px;flex-shrink:0;border-radius:4px;object-fit:cover}
.stsec{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:6px;min-height:36px;margin-top:10px;background:var(--card);border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--text)}
.stsec:first-child{margin-top:0}
.stsec .c{font-size:12px;font-weight:500;color:var(--muted)}
.sthead{height:36px;border-bottom:1px solid var(--border);font-size:12px;font-weight:500;color:var(--muted)}
.strow{min-height:52px;border-bottom:1px dashed var(--dash)}
.strow:last-child{border-bottom:0}
.c-name{flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--name);word-break:keep-all}
.c-diff{width:76px}.c-party{width:48px;font-size:13px;color:var(--sub);white-space:nowrap}.c-price{width:92px;text-align:right;font-size:13px;font-weight:700;color:var(--price);white-space:nowrap}
.c-act{position:relative;display:flex;gap:4px}
.sthead>.c-act,.strow>.c-act{width:136px;justify-content:flex-end;flex-shrink:0}
.sthead,.strow{padding-inline:8px}.strow.pick{cursor:pointer;border-radius:8px}.strow.pick:hover{background:var(--soft)}
.strow.picked{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.strow.eslot .c-name{font-size:13px;color:var(--muted)}.strow.eslot .es{margin-left:8px;font-size:11px;color:var(--faint)}
.fr.ph{border:1px dashed var(--border2);background:transparent;color:var(--faint)}
.slot-hd{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:8px 10px;border-radius:8px;border:1px dashed var(--border2)}
.slot-hd.ed{border-style:solid;border-color:var(--accent);background:var(--accent-bg)}
.slot-hd>span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}.slot-hd b{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--text)}.slot-hd em{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-style:normal;font-size:12px;color:var(--sub)}
.slot-hd .hd-img{flex-shrink:0;width:40px;height:40px;border-radius:6px;object-fit:cover}
.slot-hd .ph{display:grid;place-items:center;width:40px;height:40px;border-radius:6px;border:1px dashed var(--border2);color:var(--faint)}
.mini-btn.on{background:var(--accent-soft);color:var(--accent)}
.mini-btn{display:grid;place-items:center;width:24px;height:24px;border-radius:4px;color:var(--muted)}
.mini-btn:hover:not(:disabled){background:var(--soft);color:var(--text2)}
.mini-btn:disabled{opacity:.3}

/* reward */
.rw-price{display:flex;align-items:baseline;gap:6px}.rw-price .coin{align-self:center}
.rw-price b{font-size:18px;font-weight:800;color:var(--price)}
.lrow{display:flex;align-items:center;gap:8px;min-height:36px}
.lrow .n{flex:1;min-width:0;font-size:13px;font-weight:500;color:var(--name)}
.lrow .inp{width:84px;flex-shrink:0;padding:0 8px;font-size:12px}
.lrow .n{line-height:18px}

/* dev placeholder */
.dev{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:24px;padding:48px 24px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card);text-align:center}
.dev h2{margin:0;font-size:16px;color:var(--text)}
.dev p{margin:0;font-size:13px;color:var(--muted);line-height:20px}
.dev ul{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.dev li{padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--sub);font-size:12px}

/* modal */
.scrim{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,12,20,.5)}
.modal{width:100%;max-width:460px;border-radius:12px;background:var(--bg);border:1px solid var(--frame-bd);box-shadow:0 16px 48px rgba(0,0,0,.3);overflow:hidden}
.m-head{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 12px 0 20px;background:var(--modal-top);color:#fff;font-size:15px;font-weight:700}
.m-head button{display:grid;place-items:center;width:32px;height:32px;border-radius:6px;color:#fff}
.m-body{display:flex;flex-direction:column;gap:10px;padding:16px 20px 20px}
/* 캐릭터 창 (옥션 캐릭터 선택 창 모양) */
.modal.cm{max-width:1000px;border-radius:14px;background:var(--cm-head)}
.cm-head{display:flex;align-items:center;gap:10px;min-height:64px;padding:12px 16px 12px 24px}
.cm-pill-w{position:relative}
.cm-pill{display:flex;align-items:center;gap:8px;width:180px;height:34px;padding:0 14px 0 14px;border-radius:999px;background:var(--card);font-size:15px;font-weight:500;color:var(--text);text-align:left}
.cm-pill .t{flex:1}
.cm-dd{position:absolute;top:calc(100% + 6px);left:0;z-index:5;display:flex;flex-direction:column;gap:2px;min-width:180px;max-height:320px;overflow-y:auto;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--card);box-shadow:var(--pop-shadow)}
.cm-dd button{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border-radius:6px;font-size:14px;color:var(--text);text-align:left}
.cm-dd button:hover,.cm-dd button.on{background:var(--soft)}
.cm-dd button.on{font-weight:700}
.cm-dd small{margin-left:auto;font-size:12px;color:var(--muted)}
.wicon{width:16px;height:16px;flex-shrink:0;object-fit:contain}
.wicon.ph{display:grid;place-items:center;border-radius:50%;background:var(--seg);font-size:9px;font-weight:800;color:var(--sub);line-height:1}
.cm-cnt{font-size:13px;color:var(--sub)}.cm-cnt b{color:var(--text)}
.cm-edit{margin-left:auto;height:32px;padding:0 14px;border-radius:999px;background:var(--card);font-size:13px;font-weight:700;color:var(--sub)}
.cm-edit.on{background:var(--danger);color:#fff}
.cm-x{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;color:var(--text2)}.cm-x:hover{background:rgba(0,0,0,.06)}
.cm-body{display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 140px);overflow-y:auto;padding:24px 28px 20px;border-radius:14px 14px 0 0;background:var(--card)}
.cm-hint{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger-fg);font-size:12px}
.cm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cm-card{position:relative;display:flex;flex-direction:column;border-radius:10px;border:1px solid var(--border);background:var(--cm-card);transition:border-color .15s}
.cm-card:hover{border-color:var(--accent)}
.cm-pick{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 8px 16px;border-radius:10px;text-align:center}
.cm-pic{display:grid;place-items:end center;width:100%;height:112px;margin-bottom:8px}
.cm-pic img{max-width:120px;max-height:112px;object-fit:contain;image-rendering:pixelated}
.cm-pic img.look{width:96px;height:96px;max-width:none;object-fit:none}
.cm-sil{opacity:.5}
.cm-card b{font-size:15px;font-weight:700;color:var(--name)}
.cm-card small{font-size:12px;color:var(--muted)}
.cm-card.on{background:var(--cm-on);border-color:var(--cm-on)}
.cm-card.on b{color:#fff}.cm-card.on small{color:rgba(255,255,255,.85)}
.cm-card.edit{animation:none;border-style:dashed}
.cm-card.edit .cm-pick{cursor:default}
.cm-del{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cm-del:hover{background:var(--danger-hover)}
.cm-add{align-items:center;justify-content:center;gap:6px;min-height:210px;border-style:dashed;border-color:var(--border2);background:transparent;color:var(--sub)}
.cm-add b{margin-top:6px;font-size:14px;color:var(--sub)}
.cm-pages{display:flex;justify-content:center;gap:6px;padding-top:4px}
.cm-pages button{min-width:32px;height:32px;padding:0 6px;border-radius:6px;font-size:14px;color:var(--sub)}
.cm-pages button.on{border:1px solid var(--accent);color:var(--accent);font-weight:700}
.cm-pages button:disabled{opacity:.35}
.info{display:flex;align-items:center;gap:6px;min-height:36px;padding:8px 12px;border-radius:8px;border:1px solid var(--info-bd);background:var(--info-bg);color:var(--info-fg);font-size:12px}
.m-search{display:flex;gap:6px}
.m-search .search{flex:1}
.m-search .btn{height:36px;min-width:72px}
.found{display:flex;align-items:center;gap:14px;padding:12px;border-radius:12px;border:1px solid var(--card-bd);background:var(--card)}
.found .pic{position:relative;display:grid;place-items:end center;width:84px;height:92px;flex-shrink:0;border-radius:8px;background:var(--avatar-bg);overflow:hidden}
.found .pic img{width:64px;height:86px;object-fit:contain;object-position:bottom;image-rendering:pixelated}
/* 넥슨 API 외형 이미지(96×96, 여백 포함)는 원본 크기 그대로 */
.found .pic img.look{width:96px;height:96px;flex-shrink:0;object-fit:none;margin-bottom:-6px}
.b-ava img.look{left:2px;bottom:-6px;width:96px;height:96px;object-fit:none}
.keybox{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:8px;border:1px dashed var(--border2);background:var(--card)}
.keyrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:500;color:var(--sub)}
.keyrow small,.khint{font-size:11px;font-weight:400;color:var(--muted)}
.keyrow.on{justify-content:flex-start;padding:0 2px;color:var(--teal-fg)}.keyrow.on .linkish{margin-left:auto}
.kdot{width:7px;height:7px;border-radius:50%;background:var(--teal-fg)}
.keybox .m-search .search{min-height:32px}.keybox .m-search input{height:30px;font-size:13px}.keybox .m-search .btn{height:32px}
.m-err{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;border-radius:6px;background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger-fg);font-size:12px;line-height:18px}
.m-err svg{flex-shrink:0;margin-top:2px}
.found .ok{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--teal-fg)}
.m-btns{display:flex;gap:8px;margin-top:4px}
.m-btns .btn{height:36px}
.m-btns .btn:first-child{flex:1}.m-btns .btn:last-child{flex:1.6}

/* 알림: 메이플 옥션과 같은 주황 알약, 화면 위 가운데에서 내려와 쌓임 */
#toasts{position:fixed;top:20px;left:0;right:0;z-index:90;pointer-events:none}
.toast{position:absolute;top:0;left:50%;display:flex;align-items:center;gap:4px;width:max-content;max-width:calc(100vw - 32px);min-height:32px;padding:8px 12px;border-radius:999px;background:#F68600;color:#fff;font-size:13px;font-weight:500;line-height:16px;opacity:0;transform:translate(-50%,calc(var(--y,0px) - 150%));transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .4s ease}
.toast.in{opacity:1;transform:translate(-50%,var(--y,0px))}
.toast.out{opacity:0}
.toast svg{flex-shrink:0;margin-top:1px}
.toast p{margin:0;min-width:0;overflow-wrap:anywhere}

/* app shell: 넓은 화면에선 페이지는 고정, 패널마다 자체 스크롤 */
/* ── 모양 규칙 (모서리·높이·정렬) ──
   바깥 틀 12px → 안쪽 카드 12-6=6px (틀 안쪽 여백 6px과 맞물림), 입력칸·버튼 8px, 작은 아이콘 버튼 6px
   높이: 입력칸·선택칸·단계 버튼·일반 버튼 32px / 큰 버튼·검색·통째 선택(seg) 36px / 줄 안 작은 선택(seg-in) 32px */
.panel{padding:6px;gap:6px;border-radius:12px}
.inner{border-radius:6px}.ftabs{border-radius:6px 6px 0 0}.ftab{border-radius:6px 6px 0 0}.fbody{border-radius:0 0 6px 6px}
.panel>.search{border-radius:6px}
.datebar,.note{border-radius:12px}
.pop{border-radius:12px}
.sel,.inp,.pct input,.cp-step{height:32px;border-radius:8px}.cfgp .sel{height:32px}
.cp-step button{width:32px}
.pct span{top:50%;transform:translateY(-50%);line-height:1}
.btn{height:32px;border-radius:8px}.btn.lg{height:36px}.cp-btns .btn,.brw .btn{height:32px}
.mini-btn{border-radius:6px}
.slot-hd,.cp-prev{border-radius:8px}
.seg.seg-in{height:32px;padding:3px}.seg.seg-in button{height:26px}
.frow{min-height:32px}
.datebar .dnow{height:auto;min-height:32px;align-items:baseline;padding-block:7px}.datebar .dnow svg{align-self:center}
.datebar button span{line-height:1}
/* 스크롤 영역 안 항목이 눌려 납작해지지 않게 (높이 제각각 원인) */
.fbody>*{flex-shrink:0}
/* 폼 안 가로 줄 맞춤: 섹션 안쪽 4px에 맞춰 위쪽 선택칸·슬롯 카드도 같은 선 */
.fbody>.tseg,.fbody>.slot-hd,.fbody>.once-note,.fbody>.seg{margin-inline:4px}
/* 일간·주간·월간: 고른 칸은 다른 선택과 같은 흰 알약, 종류 색은 작은 점으로만 */
.tseg button::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--tc);opacity:.45;transition:opacity .15s}
.tseg button.on::before{opacity:1}
.tseg button[data-tt="D"]{--tc:#4AA5D6}.tseg button[data-tt="W"]{--tc:#9DB32E}.tseg button[data-tt="M"]{--tc:#7C4DEB}

  .sx-brow2>.sx-m:nth-of-type(4){grid-column:3}.sx-brow2>.sx-m:last-child{grid-column:4}
  .sx-table .sx-bhead{display:none}
}

/* 좁은 폭에서 이름이 잘리지 않게: 판매·몫 칸이 먼저 줄고, 더 좁으면 태그를 숨김 */
.sx-table{container:sxt/inline-size}
.sx-arow{padding-block:8px}
.sx-arow .c-name{flex:1 1 auto;min-width:150px}
.sx-tg{flex:0 1 170px;min-width:0}
@container sxt (max-width:560px){.sx-tg{display:none}.sx-bhead .sx-tg{display:none}.sx-arow .c-name{min-width:0}}
/* 폰: 선택 테두리에 글자·아이콘이 붙지 않게 줄 안쪽 여백 유지 */
.sx-table .sx-bhead,.sx-table .sx-brow{padding-inline:8px}
/* 좁은 폭 물욕 목록: 예상가·내 수익을 한 칸에 위아래로 (겹침 방지) */
@container sxt (max-width:460px){
  .sx-auc .sx-arow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;row-gap:2px}
  .sx-auc .sx-arow>.sx-ifr{grid-row:1/3;grid-column:1}
  .sx-auc .sx-arow>.c-name{grid-row:1/3;grid-column:2}
  .sx-auc .sx-arow>.sx-m{grid-column:3;width:auto;min-width:0;justify-self:end}
  .sx-auc .sx-arow>.sx-m:last-child{grid-row:1;align-self:end;font-size:13.5px}
  .sx-auc .sx-arow>.sx-m:nth-last-child(2){grid-row:2;align-self:start;font-size:11.5px;font-weight:500;color:var(--muted)}
  .sx-auc .sx-arow>.sx-m:nth-last-child(2)::before{content:'예상 ';font-weight:400}
  .sx-auc .sx-arow>.sx-m:nth-last-child(2) .coin{display:none}
  .sx-auc .sx-bhead>:nth-last-child(2){display:none}
}
@container sxt (max-width:460px){
  .sx-auc .sx-arow>.sx-m:nth-last-child(2):has(>.sx-z)::before{content:none}
  .sx-auc .sx-arow.pend>.sx-m:nth-last-child(2){visibility:hidden}
}
/* 좁은 폭 결정 분배 목록: 클리어 수 칸을 빼서 이름·난이도가 잘리지 않게 */
@container sxt (max-width:460px){
  .sx-table:not(.sx-auc) .sx-arow>.sx-n,.sx-table:not(.sx-auc) .sx-bhead>.sx-n{display:none}
  .sx-table:not(.sx-auc) .sx-arow>.sx-m{width:auto;min-width:0}
  .sx-arow .c-name b .dk{flex-shrink:0}
}

.sx-spin{flex:1;min-width:0;max-width:200px;margin-left:auto;text-align:right;font-weight:700}
.sx-spv{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-top:-4px;text-align:right}.sx-spv b{min-height:18px;font-size:13px;font-weight:700;color:var(--accent)}.sx-spv b.bad{color:var(--danger)}.sx-spv span{font-size:11px;color:var(--muted);line-height:15px}
.sx-stl b{color:var(--danger)!important}.sx-stl.get b{color:var(--good,#2BA56B)!important}.sx-stl.done b{color:var(--muted)!important;text-decoration:line-through}
.sx-sdone{align-items:center}.sx-sdone>span{font-size:12px;color:var(--muted)}.sx-sdone .tg-lbl{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--sub)}
.sx-sr:not(:has(> :nth-child(3))){grid-template-columns:1fr auto}
/* 혼자 튀는 막대: 물결로 자름 */
.sx-stk.cut{position:relative}
.sx-brk{position:absolute;left:-2px;right:-2px;height:9px;margin-top:-4px;pointer-events:none}
.sx-brk svg{display:block;width:100%;height:100%}.sx-brk path{fill:var(--card)}

const NXERR={OPENAPI00001:'넥슨 서버 오류예요. 잠시 후 다시 시도해 주세요.',OPENAPI00002:'이 API 키로는 조회할 수 없어요.',OPENAPI00003:'캐릭터 식별자가 올바르지 않아요.',

async function nx(path,params){
  const u=new URL('https://open.api.nexon.com/maplestory/v1/'+path);
  Object.entries(params).forEach(([k,v])=>{if(v!=null)u.searchParams.set(k,v)});
  let r;try{r=await fetch(u,{headers:{'x-nxopen-api-key':nxKey()}})}
  catch(e){throw new Error('넥슨 API에 연결하지 못했어요. 내려받은 HTML 파일을 크롬에서 열어 다시 해 보세요. (실제 서비스는 서버를 거쳐 호출해요)')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const c=j.error&&j.error.name;throw new Error(NXERR[c]||`조회하지 못했어요 (${r.status})`)}
  return j;
}
/* 메푸리 API 서버(Cloudflare Worker) 주소가 있으면 그쪽으로 — 키 없이 이름만 보냄 */

function syncClock(r){const d=Date.parse(r.headers.get('date')||'');if(!d)return;const off=d-Date.now();
  if(Math.abs(off)>60000){CLOCK_OFF=off;const t=TODAY;calcDates();paintTimers();if(TODAY!==t)render()}}
let SAME_API=false; // 이 사이트를 메푸리 Worker가 보여주는 중이면 같은 주소의 /api 를 자동으로 씀
const savedBase=()=>{try{return (localStorage.getItem(APIKEY)||'').trim().replace(/\/+$/,'')}catch(e){return ''}};
const apiBase=()=>savedBase()||(SAME_API?location.origin:'');
if(/^https?:$/.test(location.protocol))fetch('/api/health',{cache:'no-store'}).then(r=>{syncClock(r);return r.ok?r.json():null}).then(j=>{if(j&&j.service==='mepuri-api'){SAME_API=true;if(ui.modal)renderLayer();fixLooks();cloudInit();setTimeout(chalScan,1500)}}).catch(()=>{});
const setApiBase=v=>{try{v?localStorage.setItem(APIKEY,v.trim().replace(/\/+$/,'')):localStorage.removeItem(APIKEY)}catch(e){}};

async function srv(path,params){

  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  let r;try{r=await fetch(u)}catch(e){throw new Error('API 서버에 연결하지 못했어요. 테스트 설정의 서버 주소를 확인해 주세요.')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const er=j.error||{};throw new Error(NXERR[er.name]||er.message||`조회하지 못했어요 (${r.status})`)}

/* 넥슨 외형 이미지(96×96)는 캐릭터 주변이 거의 투명해서 작게 보임 → 캐릭터 부분만 잘라서 저장.
   서버(/api/look)를 거쳐 같은 주소로 받아야 캔버스로 잘라낼 수 있음. 실패하면 원본 이미지를 그대로 씀 */
async function loadImg(url){const im=new Image();im.crossOrigin='anonymous';im.src=url;await im.decode();return im}
// 서 있는 자세(A00) 프레임 번호를 붙인 외형 이미지 주소
function lookFrame(src,n){const u=new URL(src);u.searchParams.set('action','A00.'+n);u.searchParams.set('emotion','E00.0');if(!u.searchParams.get('wmotion'))u.searchParams.set('wmotion','W00');return u.toString()}
// 대기 모션 프레임 3장을 받아 같은 범위로 잘라냄 → {img: 첫 프레임, frames: [3장]}
async function buildLook(src){
  if(!src||!apiBase())return null;
  const via=u=>apiBase()+'/api/look?u='+encodeURIComponent(u);
  let ims;try{ims=await Promise.all([0,1,2].map(n=>loadImg(via(lookFrame(src,n)))))}catch(e){ims=[await loadImg(via(src))]}
  const w=ims[0].naturalWidth,h=ims[0].naturalHeight;let x0=w,y0=h,x1=-1,y1=-1;const cvs=[];
  for(const im of ims){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');g.drawImage(im,0,0);
    const d=g.getImageData(0,0,w,h).data;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    cvs.push(cv)}
  if(x1<0)return null;
  const cw=x1-x0+3,ch=y1-y0+3;
  const frames=cvs.map(cv=>{const o=document.createElement('canvas');o.width=cw;o.height=ch;o.getContext('2d').drawImage(cv,x0-1,y0-1,cw,ch,0,0,cw,ch);return o.toDataURL('image/png')});
  return {img:frames[0],frames:frames.length>1?frames:null};
}
async function fromSrv(b){
  const lk=await buildLook(b.image).catch(()=>null);
  return {ocid:b.ocid,name:b.name,world:b.world,lv:b.level,job:b.job,img:(lk&&lk.img)||b.image||null,frames:lk&&lk.frames||null,look:!lk&&!!b.image,lookUrl:b.image||null,lookV:2,at:new Date().toISOString().slice(0,10)};
}
// 예전 방식(원본 이미지·정지 이미지)으로 저장된 캐릭터도 다시 만들어 저장
async function fixLooks(){
  let n=0;for(const c of st.chars){const src=c.lookUrl||(c.look?c.img:null);if(!src||c.lookV===2)continue;
    const lk=await buildLook(src).catch(()=>null);c.lookV=2;if(lk){c.lookUrl=src;c.img=lk.img;c.frames=lk.frames;c.look=false;n++}}

// 대기 모션: 0.5초마다 프레임 0→1→2→1 순서로 바꿈 (게임과 같은 간격)
let IDLE_T=0;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{IDLE_T++;const k=[0,1,2,1][IDLE_T%4];

    if(fr&&fr[k%fr.length]&&im.getAttribute('src')!==fr[k%fr.length])im.src=fr[k%fr.length]})},500);
/* ---------- 챌린저스 월드에서 옮겨 온 캐릭터 ----------
   챌린저스 캐릭터와 옮긴 뒤 본섭 캐릭터는 API에서 다른 캐릭터(ocid)라서 '옮겼다'가 바로 안 나옴.
   이제 일반 월드끼리 리프가 없으니, 시즌 중·종료 리프 기간에 높은 레벨로 갑자기 생긴 캐릭터는 챌린저스에서 온 걸로 봄.
   on: 조회하는 시즌 (1~3은 아직 안 씀, 표만 둠) */
const CHAL_SEASONS=[
  {n:1,name:'NEXT',from:'2024.12.19',to:'2025.05.22',on:false},
  {n:2,name:'ASSEMBLE',from:'2025.06.19',to:'2025.11.20',on:false},
  {n:3,name:'CROWN',from:'2025.12.18',to:'2026.04.16',on:false},
  {n:4,name:'OVERDRIVE',from:'2026.06.18',to:'2026.09.17',leapTo:'2026.09.30',on:true,boss:'메이린'}];
const CHAL_LV=200; // 처음 생긴 날 이 레벨 이상이면 옮겨 온 캐릭터
// 그날 기준 정보 {lv, world}, 그날 캐릭터가 없었으면 null
async function basicAt(ocid,d){const date=d.replace(/\./g,'-');
  try{if(apiBase()){const b=await srv('/api/character/basic',{ocid,date});return {lv:b.level,world:b.world}}
    const b=await nx('character/basic',{ocid,date});return b&&b.character_name?{lv:b.character_level,world:b.world_name}:null}
  catch(e){if(/정보가 없|찾을 수 없/.test(e.message))return null;throw e}}
// 결과: {s:시즌, at:처음 보인 날, lv} 또는 null(옮겨 온 캐릭터 아님). 조회 실패면 throw (다음에 다시)
async function chalCheck(c){
  for(const s of CHAL_SEASONS.filter(x=>x.on)){
    const end=addD(REAL,-1);if(end<=s.from)continue; // 옮긴 날은 사람마다 달라서(일찍·늦게) 어제까지 다 봄
    if(await basicAt(c.ocid,s.from))continue;             // 시즌 시작 때 이미 본섭에 있었음
    const last=await basicAt(c.ocid,end);if(!last)continue;
    let a=s.from,b=end;while(dnum(b)-dnum(a)>1){const m=addD(a,Math.floor((dnum(b)-dnum(a))/2));if(await basicAt(c.ocid,m))b=m;else a=m}
    const first=await basicAt(c.ocid,b);

  return null}
let CHAL_BUSY=false;
// 아직 안 본 캐릭터만 차례로 확인 (한 번 확인하면 c.chal에 남김: 객체 = 옮겨 옴, null = 아님)
// 이 기능이 생기기 전에 추가한 캐릭터도 c.chal이 비어 있으니 처음 접속할 때 알아서 확인함
async function chalScan(){if(CHAL_BUSY||!apiOn())return;CHAL_BUSY=true;let hit=null,n=0,err=false;
  try{for(const c of st.chars){if(!c.ocid||c.chal!==undefined)continue;
    try{const r=await chalCheck(c);c.chal=r;n++;save(true);if(r)hit=c}catch(e){err=true;break}}}
  finally{CHAL_BUSY=false}
  if(n)save(); // 계정에도 남김 → 다른 기기·다음 접속 때 다시 조회 안 함
  if(hit)render(); // 조용히 기록만 (따로 알리지 않음)
  if(!err&&st.chars.some(c=>c.ocid&&c.chal===undefined))setTimeout(chalScan,1000)} // 확인 도중 계정 기록을 불러와 캐릭터가 바뀐 경우
const chalTag=c=>c&&c.chal?`<span class="chal-tag" title="챌린저스 월드 ${c.chal.s}에서 ${md(c.chal.at)}쯤 옮겨 왔어요">챌${c.chal.s}</span>`:'';
// 보고 있는 날이 챌린저스 시절인지: 'before' 옮기기 전 주, 'week' 옮긴 주, null
// 본섭 캐릭터 기록이 없던 때(시즌 시작 ~ 처음 보인 날 전)가 챌린저스 시절. 시즌 전 주는 해당 없음
function chalWhen(c){if(!c||!c.chal)return null;const at=c.chal.at,from=c.chal.from||(CHAL_SEASONS.find(x=>x.n===c.chal.s)||{}).from||'';if(WEEK[6]<from)return null;if(WEEK[6]<at)return 'before';if(WEEK[0]<=at&&at<=WEEK[6])return 'week';return null}
// 캐릭터 이름 → ocid → 기본 정보(월드·레벨·직업·외형 이미지)

var cloud=null; // save()가 먼저 불릴 수 있어서 var
const CLOUDK='mepuri-cloud'; // 이 기기의 동기화 상태 {uid, rev, dirty}
function cloudMeta(){try{return JSON.parse(localStorage.getItem(CLOUDK)||'null')||{}}catch(e){return {}}}

async function capi(method,path,body,keepalive){

// 올릴 기록: 테마(기기마다 다름)와 캐릭터 그림(외형 주소로 다시 만들 수 있음)은 빼서 가볍게

  let keep=0;(st.chars||[]).forEach(c=>{const k=old[c.ocid||c.id];if(!c.img&&k&&k.img&&k.lookUrl===c.lookUrl){c.img=k.img;c.frames=k.frames;c.lookV=k.lookV}
    if(c.chal===undefined&&k&&k.chal!==undefined&&k.ocid===c.ocid){c.chal=k.chal;keep++}}); // 이 기기에서 확인한 챌린저스 결과는 이어 붙임
  if(!st.chars.find(c=>c.id===st.sel))st.sel=st.chars[0]?st.chars[0].id:null;
  ui.pop=null;ui.cfg=null;save(!keep);applyTheme();render();fixLooks();setTimeout(chalScan,800)}
function cloudQueue(){if(!cloud||!cloud.user)return;cloud.dirty=true;cloudSaveMeta();paintAcct();clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudPush,1200)}
async function cloudPush(){if(!cloud||!cloud.user||cloud.busy||!cloud.dirty||cloud.state==='conflict')return;
  cloud.busy=true;cloud.dirty=false;cloud.state='saving';paintAcct();
  try{const r=await capi('PUT','/api/state',{data:packState(),rev:cloud.rev});
    if(r.s===200){cloud.rev=r.j.rev;cloud.state='saved';cloud.at=new Date()}
    else if(r.s===409){cloud.dirty=true;cloud.state='conflict';ui.modal={kind:'cloud',why:'conflict',srv:r.j};renderLayer()}
    else if(r.s===401){cloud.dirty=true;cloud.uid=cloud.user.email;cloud.user=null;cloud.state='off';toast('로그인이 풀렸어요. 다시 로그인하면 이어서 저장돼요')}
    else{cloud.dirty=true;cloud.state='error';toast(r.j&&r.j.error?r.j.error.message:'계정에 저장하지 못했어요')}
  }catch(e){cloud.dirty=true;cloud.state='error'}

  if(cloud.state==='error'){clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudPush,15000)}else if(cloud.dirty&&cloud.state==='saved')cloudPush()}
async function cloudInit(){
  cloud={cfg:null,user:null,uid:cloudMeta().uid||null,rev:cloudMeta().rev||0,dirty:!!cloudMeta().dirty,state:'off',at:null,timer:0,busy:false};
  try{const c=await capi('GET','/api/config');cloud.cfg=c.j;if(!c.j||!c.j.auth){paintAcct();return}
    const me=await capi('GET','/api/me');if(me.j&&me.j.user){cloud.user=me.j.user;await cloudPull('load')}}catch(e){}

    if(document.visibilityState==='hidden'&&cloud.user&&cloud.dirty&&!cloud.busy){clearTimeout(cloud.timer);capi('PUT','/api/state',{data:packState(),rev:cloud.rev},true).then(r=>{if(r.s===200){cloud.rev=r.j.rev;cloud.dirty=false;cloudSaveMeta()}}).catch(()=>{})}
    else if(document.visibilityState==='visible'&&cloud.user&&!cloud.dirty)cloudPull('load')});

// mode: 'load' 새로고침·다시 켰을 때 / 'login' 방금 로그인했을 때
async function cloudPull(mode){

  if(mine&&meta.dirty){ui.modal={kind:'cloud',why:'conflict',srv};cloud.state='conflict';renderLayer();return} // 오프라인에서 고친 것 + 다른 기기 저장이 겹침
  if(mode==='login'&&!mine&&st.chars.length){ui.modal={kind:'cloud',why:'choose',srv};cloud.state='conflict';renderLayer();return}
  cloud.rev=srv.rev;cloud.dirty=false;cloud.state='saved';cloud.at=srv.updatedAt?new Date(srv.updatedAt):null;cloudSaveMeta();unpackState(srv.data);

async function onGoogle(resp){

/* ---------- root render ---------- */
const SCR={};
function saveScroll(){document.querySelectorAll('#view [data-scroll]').forEach(el=>{SCR[el.dataset.scroll]=el.scrollTop})}
function restoreScroll(){document.querySelectorAll('#view [data-scroll]').forEach(el=>{const y=SCR[el.dataset.scroll];if(y)el.scrollTop=y})}
/* 스크롤 영역 안 팝업: 물욕 팝업은 아래가 모자라면 위로, 캐릭터 드롭다운은 패널 밖으로 띄움 */
const scrolls=el=>el&&getComputedStyle(el).overflowY==='auto';
function fitPopups(){
  const pop=document.querySelector('#view .pop');
  if(pop){const box=pop.closest('[data-scroll]');if(scrolls(box)){const b=box.getBoundingClientRect(),r=pop.getBoundingClientRect(),a=pop.parentElement.getBoundingClientRect();
    if(r.bottom>b.bottom-8&&a.top-b.top>r.height+8)pop.classList.add('up')}}
  placeDD();
  const on=document.querySelector('#view .bdd .opt.on');if(on)on.scrollIntoView({block:'nearest'});
}
function placeDD(){
  const dd=document.querySelector('#view .dd');if(!dd)return;
  const box=dd.closest('[data-scroll]');if(!scrolls(box))return;
  const sel=dd.parentElement.getBoundingClientRect(),bx=box.getBoundingClientRect(),o=dd.querySelector('.opts');
  if(sel.bottom<bx.top||sel.top>bx.bottom){ui.dd=false;ui.bdd=null;render();return}
  Object.assign(dd.style,{position:'fixed',left:sel.left+'px',right:'auto',width:sel.width+'px'});
  o.style.maxHeight='260px';
  const rest=dd.offsetHeight-o.offsetHeight,below=innerHeight-sel.bottom-16-rest,above=sel.top-16-rest;
  const up=below<140&&above>below;
  o.style.maxHeight=Math.max(72,Math.min(260,up?above:below))+'px';
  dd.style.top=(up?sel.top-4-dd.offsetHeight:sel.bottom+4)+'px';
  if(!box._dd){box._dd=1;box.addEventListener('scroll',placeDD,{passive:true})}
}
addEventListener('resize',()=>{if(ui.dd)placeDD()});

if(!st.pfix){st.chars.forEach(c=>Object.keys(c.clears||{}).forEach(id=>{if(!BY[id])return;const sl=c.slots.find(x=>x.boss===id)||{party:1};
  c.clears[id]=c.clears[id].map(e=>typeof e==='object'&&e.diff?{...e,v:(priceAt(id,e.diff,e.d)??0)*share({...sl,diff:e.diff})}:e)}));st.pfix=1;save()}
render();paintTimers();
// 30초마다 남은 시간 갱신, 날짜가 바뀌면(0시 초기화) 화면 다시 그림
setInterval(()=>{const t=TODAY;calcDates();paintTimers();if(TODAY!==t)render()},30000);
</script>
