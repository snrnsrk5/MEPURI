# Cloudflare가 GitHub 저장소를 배포할 때 읽는 설정
# Worker 이름은 대시보드에서 만든 이름과 같아야 해요
name = "mepuri"
main = "worker.js"
compatibility_date = "2026-09-01"
# 대시보드에서 넣은 변수(RATE_* 등)를 배포할 때 지우지 않고 그대로 둠
keep_vars = true

# 사이트 파일: public 폴더 (index.html = 메푸리 화면)
# /api/ 로 시작하는 주소만 worker.js가 처리하고, 나머지는 이 폴더에서 보여줌
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# 허용할 다른 사이트 주소 (쉼표로 구분). 같은 주소에서 쓰면 비워둬도 돼요
# ※ 넥슨 조회 응답에 CORS 허용 헤더를 붙일 주소예요. 다른 사이트의 요청 자체를 막지는 않아요 (막는 건 로그인·남발 방지)
ALLOWED_ORIGINS = ""
# 캐릭터 조회 남발 방지 (비워두면 기본값): 계정마다 1분 / 하루, 접속 주소마다 1분, 외형 그림은 주소마다 1분
# ※ 대시보드(설정 → 변수)에서 넣으면 배포해도 그대로 남아요 (위 keep_vars). 단, 이 파일에서 # 를 지워 적은 값은 배포 때 그 값으로 덮어요
# RATE_USER_MIN = "60"
# RATE_USER_DAY = "3000"
# RATE_IP_MIN = "120"
# RATE_LOOK_MIN = "600"
# 사이트 전체 하루 조회 한도 (비우면 없음). 넥슨 개발 키(하루 1,000건) 동안은 450 추천 — 캐릭터 찾기 1번 = 넥슨 호출 약 2번
# 서비스 키(하루 2,000만 건)로 바꾸면 지우면 돼요. 하루는 한국 시간 자정에 바뀌어요
# RATE_SITE_DAY = "450"

# API 키는 여기 적지 말고 대시보드의 비밀값(Secret) NEXON_API_KEY로 넣기
# 구글 로그인 클라이언트 ID도 대시보드 비밀값(Secret) GOOGLE_CLIENT_ID로 넣기
# 물욕 시세 관리 화면(/admin) 비밀번호도 대시보드 비밀값(Secret) ADMIN_PASSWORD로 넣기 (안 넣으면 고치기 꺼짐)

# 로그인·기록 저장용 데이터베이스 (Cloudflare D1)
# 대시보드에서 D1 데이터베이스 'mepuri'를 만든 뒤, 그 ID를 아래 database_id에 붙여넣기
[[d1_databases]]
binding = "DB"
database_name = "mepuri"
database_id = "7c9c308c-d990-449a-af45-011edc82f218"

