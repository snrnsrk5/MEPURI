# Cloudflare가 GitHub 저장소를 배포할 때 읽는 설정
# Worker 이름은 대시보드에서 만든 이름과 같아야 해요
name = "mepuri"
main = "worker.js"
compatibility_date = "2026-09-01"

# 사이트 파일: public 폴더 (index.html = 메푸리 화면)
# /api/ 로 시작하는 주소만 worker.js가 처리하고, 나머지는 이 폴더에서 보여줌
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# 허용할 다른 사이트 주소 (쉼표로 구분). 같은 주소에서 쓰면 비워둬도 돼요
ALLOWED_ORIGINS = ""

# API 키는 여기 적지 말고 대시보드의 비밀값(Secret) NEXON_API_KEY로 넣기
# 구글 로그인 클라이언트 ID도 대시보드 비밀값(Secret) GOOGLE_CLIENT_ID로 넣기

# 로그인·기록 저장용 데이터베이스 (Cloudflare D1)
# 대시보드에서 D1 데이터베이스 'mepuri'를 만든 뒤, 그 ID를 아래 database_id에 붙여넣기
[[d1_databases]]
binding = "DB"
database_name = "mepuri"
database_id = "7c9c308c-d990-449a-af45-011edc82f218"

